name: Dynamic app build

on:
  push:
    branches: [main, dynamic-app]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Prepare GitHub Pages SPA
        run: |
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          printf 'daegoncharts.com.br\n' > dist/client/CNAME
          touch dist/client/.nojekyll
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -d dist/client/assets
      - name: Upload static SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: daegon-charts-spa
          path: dist/client
          if-no-files-found: error
          retention-days: 7
