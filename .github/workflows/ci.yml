name: Dynamic app build

on:
  push:
    branches: [main, dynamic-app]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Prepare GitHub Pages SPA
        run: |
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          printf 'daegoncharts.com.br\n' > dist/client/CNAME
          touch dist/client/.nojekyll
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -d dist/client/assets
      - name: Upload static SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: daegon-charts-spa
          path: dist/client
          if-no-files-found: error
          retention-days: 7
      - name: Publish compiled SPA branch
        if: github.ref == 'refs/heads/dynamic-app' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/client
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build SPA from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:spa-pages
