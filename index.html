<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --primary: #000000;
            --secondary: #F9FAFB;
            --accent: #FFD700;
            --accent-dark: #DAA520;
            --gold: #FFD700;

            --run-down: #EF4444;
            --run-new: #FBBF24;
            --run-peak: #8B5CF6;
            --run-steady: #9CA3AF;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--secondary); position: relative; }
        .music-notes-bg { position: fixed; bottom: 20px; right: 20px; font-size: 80px; color: rgba(255, 215, 0, 0.08); z-index: 0; pointer-events: none; animation: floatNote 8s ease-in-out infinite; }

        .music-notes-bg-3 { position: fixed; top: 30%; right: 5%; font-size: 100px; color: rgba(255, 215, 0, 0.05); z-index: 0; pointer-events: none; animation: floatNote 12s ease-in-out infinite; }
        @keyframes floatNote { 0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.05; } 50% { transform: translateY(-20px) rotate(5deg); opacity: 0.1; } }
        .loader { border: 4px solid rgba(249, 250, 251, 0.1); border-top: 4px solid var(--accent); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .chart-nav-btn.active { background-color: var(--accent); color: #000000; }
        .chart-card-item { background-color: white; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: all 0.2s ease; color: #111827; cursor: pointer; }
        @media (min-width: 768px) { .chart-card-item { padding: 1.25rem; margin-bottom: 1.25rem; } }
        .chart-card-item:hover { transform: translateY(-2px); background-color: #FAFAFA; }

        .diff-up { color: #10B981; } .diff-down { color: #EF4444; } .diff-new { color: var(--accent); font-weight: bold; }
        .placeholder-art { background: linear-gradient(135deg, #E5E5E5 0%, #F5F5F5 100%); display: flex; align-items: center; justify-content: center; color: #9CA3AF; }
        .gold-title { color: #FFD700; font-weight: 800; cursor: pointer; }

        @media (min-width: 768px) { .rank-number { font-size: 1.875rem; min-width: 3.5rem; } }
        .diff-indicator { font-size: 0.7rem; font-weight: 600; display: inline-block; }
        @media (min-width: 768px) { .diff-indicator { font-size: 0.8rem; } }
        .artist-link { cursor: pointer; transition: color 0.2s; color: #111827; font-weight: 600; }
        .artist-link:hover { color: var(--accent); }
        .section-title { position: relative; display: inline-block; margin-bottom: 2rem; color: var(--secondary); }
        .section-title::after { content: ''; position: absolute; bottom: -10px; left: 0; width: 50px; height: 3px; background: var(--accent); }
        .item-details-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .item-details-modal.active { opacity: 1; pointer-events: all; }
        .modal-content { background: white; border-radius: 12px; max-width: 90%; max-height: 90%; overflow-y: auto; padding: 2rem; position: relative; color: #111827; }

        .flatpickr-input { background-color: white; border: 1px solid #E5E5E5; border-radius: 0.375rem; padding: 0.5rem 0.75rem; width: 150px; text-align: center; color: #111827; }
        .flatpickr-calendar { left: 50% !important; transform: translateX(-50%) !important; }

        .tag:hover, .tag.active { background-color: var(--accent); color: #000; }
        .filter-bar { background-color: #1a1a1a; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
        .clear-filter { background-color: rgba(255,255,255,0.1); color: white; padding: 0.3rem 1rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }

        .blog-card img { width: 100%; height: 160px; object-fit: cover; }
        @media (min-width: 768px) { .blog-card img { height: 200px; } }
        .chart-beat-nav-btn { background: none; border: none; padding: 0.5rem 1rem; font-weight: 500; transition: all 0.2s; cursor: pointer; color: #9CA3AF; }
        .chart-beat-nav-btn.active { border-bottom: 2px solid var(--accent); color: var(--accent); }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .back-to-top { position: fixed; bottom: 2rem; right: 2rem; background: var(--accent); color: #000; width: 3rem; height: 3rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; z-index: 99; box-shadow: 0 4px 12px rgba(255,215,0,0.3); border: none; }
        .back-to-top.visible { opacity: 1; transform: translateY(0); }
        .badge { font-size: 0.7rem; font-weight: bold; padding: 0.2rem 0.5rem; border-radius: 9999px; margin-left: 0.5rem; display: inline-block; }
        .badge-new-peak { background-color: #fcd34d; color: #000; }

        @media (max-width: 640px) { .weekly-charts-grid { grid-template-columns: 1fr !important; } .flatpickr-calendar { width: 90% !important; max-width: 350px !important; } .spotify-image { width: 56px; height: 56px; } .rank-number { font-size: 1.25rem; min-width: 2.5rem; } }

        .chart-stats-vertical .stat-value { color: #111827; font-weight: 700; margin-left: 0.25rem; }

        @media (min-width: 768px) { .chart-container { padding: 1.5rem; } }

        .chart-run-card.run-up { border-left-color: var(--run-up); background-color: rgba(16,185,129,0.05); }
        .chart-run-card.run-down { border-left-color: var(--run-down); background-color: rgba(239,68,68,0.05); }
        .chart-run-card.run-new { border-left-color: var(--run-new); background-color: rgba(251,191,36,0.05); }
        .chart-run-card.run-peak { border-left-color: var(--run-peak); background-color: rgba(139,92,246,0.05); }
        .chart-run-card.run-steady { border-left-color: var(--run-steady); background-color: rgba(156,163,175,0.05); }
        .chart-run-card.run-number-one { border-left-color: var(--accent); background-color: rgba(255,215,0,0.1); }
        .artist-header-image { width: 100%; height: 200px; object-fit: cover; border-radius: 16px; margin-bottom: 1.5rem; }
        @media (min-width: 768px) { .artist-header-image { height: 280px; } }
        .artist-name-large { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: white; }
        @media (min-width: 768px) { .artist-name-large { font-size: 3rem; } }
        .artist-list-card { background-color: white; border-radius: 12px; overflow: hidden; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .artist-list-header { background-color: #f8f9fa; padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; }
        .artist-list-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid #f0f0f0; color: #111827; }
        .artist-list-item:hover { background-color: #fafafa; }
        .artist-list-item .font-medium { color: #111827; font-weight: 500; }
        .units-badge { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 0.25rem; margin-left: 0.5rem; white-space: nowrap; }
        .artists-icons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
        @media (min-width: 640px) { .artists-icons-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 2rem; } }
        .artist-icon-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s ease; }
        .artist-icon-card:hover { transform: translateY(-5px); }
        .artist-icon-image { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; box-shadow: 0 8px 16px rgba(0,0,0,0.3); transition: all 0.3s ease; }

        .artist-icon-placeholder { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--accent); }
        .artist-icon-name { margin-top: 0.75rem; font-size: 0.8rem; font-weight: 500; text-align: center; color: white; }
        .circle-card { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; position: relative; margin: 0 auto; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: all 0.3s ease; }

        .circle-card-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 0.5rem; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); text-align: center; }
        .circle-card-title { font-size: 0.8rem; font-weight: 600; color: white; margin: 0; }
        .circle-cards-grid { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .circle-card-container { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; cursor: pointer; }
        .circle-card-label { font-size: 0.8rem; font-weight: 500; color: var(--secondary); text-align: center; }
        .chart-nav-btn { background-color: white; color: #111827; border: 1px solid #E5E5E5; border-radius: 0.375rem; padding: 0.5rem 1rem; font-weight: 600; transition: all 0.2s ease; }
        .chart-nav-btn:hover { background-color: #F5F5F5; border-color: var(--accent); }
        .chart-nav-btn.active { background-color: var(--accent); color: #000; border-color: var(--accent); }
        .btn-hover:active { transform: scale(0.97); }
        .chart-card { cursor: pointer; transition: all 0.2s ease; background-color: #000; border: 1px solid #1f1f1f; border-radius: 12px; padding: 1rem; }
        .chart-card:hover { border-color: var(--accent); }
        .goat-card-border:hover { border-color: var(--gold); }
        .goat-text { color: var(--gold); }
        .year-btn { background: rgba(255,215,0,0.1); color: var(--accent); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
        .year-btn:hover { background: rgba(255,215,0,0.3); }
        .year-btn.active { background: var(--accent); color: #000; }
        .year-selector { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
        .back-button { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 600; transition: color 0.2s; }
        .artist-list-item .text-gray-500 { color: #6B7280; }
        .artist-list-item .text-xs { color: #6B7280; }
        .about-card { background: linear-gradient(135deg, #0a0a0a 0%, #111 100%); border-radius: 24px; padding: 2rem; margin-bottom: 2rem; border: 1px solid rgba(255,215,0,0.2); }
        .about-icon { font-size: 2rem; color: var(--accent); margin-bottom: 1rem; }
        .formula-box { background: rgba(255,215,0,0.1); border-left: 4px solid var(--accent); padding: 1rem; border-radius: 8px; margin: 1rem 0; font-family: monospace; }
        .chart-badge { display: inline-block; background: var(--accent); color: #000; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.7rem; font-weight: 600; margin-right: 0.5rem; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <div class="music-notes-bg"><i class="fas fa-music"></i></div>
    <div class="music-notes-bg-2"><i class="fas fa-music"></i></div>
    <div class="music-notes-bg-3"><i class="fas fa-headphones"></i></div>
    <header class="bg-black border-b border-gray-800 sticky top-0 z-20 shadow-sm">
        <div class="container mx-auto px-4 py-3 md:py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-3xl font-extrabold"><span class="gold-title" id="mainTitle">daegon charts</span></h1>
            <nav class="flex space-x-2 md:space-x-4">
                <button id="navAbout" class="text-xs md:text-sm font-semibold text-gray-300 hover:text-accent transition-colors">About</button>
                <button id="navAllArtists" class="text-xs md:text-sm font-semibold text-gray-300 hover:text-accent transition-colors">All Artists Entries</button>
                <button id="navChartBeat" class="text-xs md:text-sm font-semibold text-gray-300 hover:text-accent transition-colors">Chart Beat</button>
            </nav>
        </div>
    </header>
    <main id="app" class="flex-grow container mx-auto p-3 md:p-6 relative z-10"></main>
    <footer class="bg-black mt-8 py-6 border-t border-gray-800 relative z-10">
        <div class="container mx-auto px-4 text-center text-gray-500 text-xs md:text-sm">
            <p>Chart generated based on dantaswt's Last.fm data</p>
            <p class="mt-2">Developed with <i class="fas fa-heart text-red-500"></i> using HTML, CSS & JavaScript</p>
        </div>
    </footer>
    <div class="item-details-modal" id="itemDetailsModal"><div class="modal-content w-full max-w-2xl"><button class="close-modal" id="closeModal">×</button><div id="modalContent"></div></div></div>

    <script>
        // ==================== CONFIG ====================
        const SPOTIFY_CLIENT_ID = '60d65b0ac9f14d6aa91c08a66894cea9';
        const SPOTIFY_CLIENT_SECRET = 'caf3f20ae798475e8dec65697f210c2a';
        let SPOTIFY_ACCESS_TOKEN = '';
        let imageCache = {};
        try { const saved = localStorage.getItem('daegon_image_cache'); if(saved) imageCache = JSON.parse(saved); } catch(e) {}
        function saveImageCache() { try { localStorage.setItem('daegon_image_cache', JSON.stringify(imageCache)); } catch(e) {} }

        const weeklyChartList = ['songs', 'artists', 'albums', 'radioSongs', 'topStreamingAlbums', 'topAlbumSales'];
        const yearEndList = ['yearEndSongs', 'yearEndArtists', 'yearEndAlbums'];
        const goatList = ['goatSongs', 'goatArtists', 'goatAlbums'];

        const chartsConfig = {
            songs: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=904867620', title: 'Hot 100', icon: 'fa-music', loaded: false },
            artists: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1568177610', title: 'Artist 50', icon: 'fa-user', loaded: false },
            albums: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1940039611', title: 'Top 100 Albums', icon: 'fa-compact-disc', loaded: false },
            radioSongs: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1681272096', title: 'Radio Songs', icon: 'fa-radio', loaded: false },
            topStreamingAlbums: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1028545573', title: 'Top Streaming Albums', icon: 'fa-headphones', loaded: false },
            topAlbumSales: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1111633725', title: 'Top Album Sales', icon: 'fa-chart-simple', loaded: false },
            yearEndSongs: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=530686468', title: 'Year-End Songs', icon: 'fa-calendar', loaded: false },
            yearEndArtists: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1597569311', title: 'Year-End Artists', icon: 'fa-calendar', loaded: false },
            yearEndAlbums: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=897935603', title: 'Year-End Albums', icon: 'fa-calendar', loaded: false },
            goatSongs: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1157278896', title: 'Songs', icon: 'fa-trophy', loaded: false },
            goatArtists: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=222299678', title: 'Artists', icon: 'fa-trophy', loaded: false },
            goatAlbums: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1548244755', title: 'Albums', icon: 'fa-trophy', loaded: false },
            artistStats: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1519606558', title: 'Artist Statistics', icon: 'fa-chart-bar', loaded: false }
        };

        const chartBeatConfig = {
            hot100: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=1019123057', title: 'Hot 100 Songs' },
            artists: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=157219648', title: 'Top 50 Artists' },
            top100Albums: { url: 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=677909186', title: 'Top 100 Albums' }
        };

        let appState = {
            activeChart: 'songs', chartData: {}, currentDate: null, currentView: 'home', currentArtist: null, currentYear: new Date().getFullYear().toString(),
            colMaps: {}, top3Data: {}, chartRunData: {}, navigationHistory: [], chartBeatData: { hot100: [], artists: [], top100Albums: [] },
            currentBlog: 'hot100', sharedDate: null, artistDetailsData: {}, activeTag: null, allArtistsList: []
        };

        const appContainer = document.getElementById('app'), modal = document.getElementById('itemDetailsModal'), modalContent = document.getElementById('modalContent'), closeModal = document.getElementById('closeModal');

        // ==================== SPOTIFY ====================
        async function getSpotifyToken() {
            if (SPOTIFY_ACCESS_TOKEN) return SPOTIFY_ACCESS_TOKEN;
            try {
                const res = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': 'Basic ' + btoa(SPOTIFY_CLIENT_ID + ':' + SPOTIFY_CLIENT_SECRET) },
                    body: 'grant_type=client_credentials'
                });
                const data = await res.json();
                SPOTIFY_ACCESS_TOKEN = data.access_token;
                return SPOTIFY_ACCESS_TOKEN;
            } catch(e) { return null; }
        }
        
        async function getSpotifyImage(query, type) {
            if (!query) return null;
            let searchQuery = query;
            if (type === 'artist') {
                searchQuery = `${query} SINGER`;
            } else if (type === 'album') {
                searchQuery = `${query} album`;
            }
            const key = `${type}:${query}`.toLowerCase();
            if (imageCache[key]) return imageCache[key];
            const token = await getSpotifyToken();
            if (!token) return null;
            try {
                const searchType = type === 'artist' ? 'artist' : 'album';
                const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(searchQuery)}&type=${searchType}&limit=1`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                let url = null;
                if (type === 'artist' && data.artists?.items?.[0]) url = data.artists.items[0].images?.[0]?.url;
                else if (type === 'album' && data.albums?.items?.[0]) url = data.albums.items[0].images?.[0]?.url;
                if (url) { imageCache[key] = url; saveImageCache(); }
                return url;
            } catch(e) { return null; }
        }

        // ==================== DATA PROCESSING ====================
        function parseCsvRow(t) { if(!t) return []; let r=[], c='', q=false; for(let i=0;i<t.length;i++){ const ch=t[i]; if(ch==='"') q=!q; else if(ch===','&&!q){ r.push(c.trim()); c=''; } else c+=ch; } r.push(c.trim()); return r; }
        
        async function fetchChartData(ct) {
            if(chartsConfig[ct]?.loaded) return true;
            const cfg = chartsConfig[ct]; if(!cfg) return false;
            const url = `${cfg.url}&_=${Date.now()}`;
            try {
                const res = await fetch(url);
                if(!res.ok) throw new Error(`Failed to fetch ${ct}`);
                let csv = await res.text();
                if(csv.charCodeAt(0)===0xFEFF) csv=csv.substring(1);
                const rows = csv.trim().split('\n').map(r=>parseCsvRow(r));
                if(rows.length<2) throw new Error(`No data for ${ct}`);
                const header = rows[0].map(h=>h.toLowerCase().trim());
                const data = rows.slice(1);
                const find = (ks) => { for(let k of ks){ let i=header.indexOf(k); if(i!==-1) return i; } return -1; };
                appState.colMaps[ct] = {
                    date: find(['date','chart date']), position: find(['position','rank','pos']), diff: find(['dif','diff','▲▼']),
                    song: find(['song','title','track']), album: find(['album']), artist: find(['artist','artists']),
                    lastWeek: find(['last week','lw']), peak: find(['peak']), weeks: find(['weeks','wks']), weeksAt1: find(['weeks at 1','wks at 1']),
                    units: find(['units','spins','sales','streams']), totalUnits: find(['total units','total']), year: find(['year','ano']),
                    chart: find(['chart']), item: find(['item']), unitsSold: find(['units sold','sales','total sales'])
                };
                if(ct === 'artistStats') {
                    appState.artistDetailsData = {};
                    data.forEach(r => {
                        const artist = r[appState.colMaps.artistStats.artist];
                        if(!artist) return;
                        const chart = r[appState.colMaps.artistStats.chart];
                        const item = r[appState.colMaps.artistStats.item];
                        const peak = parseInt(r[appState.colMaps.artistStats.peak])||0;
                        const weeks = parseInt(r[appState.colMaps.artistStats.weeks])||0;
                        const unitsSold = r[appState.colMaps.artistStats.unitsSold]||null;
                        const totalUnits = r[appState.colMaps.artistStats.totalUnits]||null;
                        if(!appState.artistDetailsData[artist]) appState.artistDetailsData[artist] = { 'Hot 100 Songs':[], 'Top 100 Albums':[], 'Top 50 Artists':[], 'Radio Songs':[], 'Top Streaming Albums':[], 'Top Album Sales':[] };
                        if(appState.artistDetailsData[artist][chart]) appState.artistDetailsData[artist][chart].push({ item, peak, weeks, unitsSold, totalUnits });
                    });
                    for(let a in appState.artistDetailsData) {
                        for(let ch in appState.artistDetailsData[a]) {
                            let entries = appState.artistDetailsData[a][ch];
                            let ones=0, tens=0;
                            entries.sort((x,y)=>x.peak-y.peak || y.weeks-x.weeks);
                            entries.forEach(e=>{ if(e.peak===1) ones++; if(e.peak<=10) tens++; });
                            appState.artistDetailsData[a][ch] = { entries, count: entries.length, numberOnes: ones, topTens: tens };
                        }
                    }
                    appState.allArtistsList = Object.keys(appState.artistDetailsData).sort((a,b)=>a.localeCompare(b));
                } else if(ct.includes('yearEnd')) {
                    const yi = appState.colMaps[ct].year;
                    const byYear = {};
                    data.forEach(r=>{ const y=r[yi]; if(y){ if(!byYear[y]) byYear[y]=[]; byYear[y].push(r); } });
                    appState.chartData[ct] = byYear;
                    const years = Object.keys(byYear).sort((a,b)=>b-a);
                    if(years[0] && byYear[years[0]]) {
                        const cm = appState.colMaps[ct];
                        appState.top3Data[ct] = byYear[years[0]].slice(0,3).map(r=>({
                            position: r[cm.position]||0, artist: r[cm.artist]||'Unknown',
                            name: ct==='yearEndSongs'?r[cm.song]:ct==='yearEndAlbums'?r[cm.album]:r[cm.artist], year: years[0]
                        }));
                    }
                } else if(ct.includes('goat')) {
                    appState.chartData[ct] = data;
                    const cm = appState.colMaps[ct];
                    appState.top3Data[ct] = data.slice(0,3).map(r=>({
                        position: r[cm.position]||0, artist: r[cm.artist]||'Unknown',
                        name: ct.includes('Songs')?r[cm.song]:ct.includes('Albums')?r[cm.album]:r[cm.artist]
                    }));
                } else {
                    const di = appState.colMaps[ct].date;
                    const groups = {};
                    data.forEach(r=>{ let d=r[di]; if(d){ if(d.includes('/')){ const p=d.split('/'); if(p.length===3) d=`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; r[di]=d; } } });
                    data.forEach(r=>{ const d=r[di]; if(d){ if(!groups[d]) groups[d]=[]; groups[d].push(r); } });
                    const sorted = Object.keys(groups).sort((a,b)=>new Date(a)-new Date(b));
                    appState.chartData[ct] = {};
                    sorted.forEach(d=>{ appState.chartData[ct][d]=groups[d]; });
                    appState.chartRunData[ct] = {};
                    data.forEach(r=>{
                        const d=r[di]; if(!d) return;
                        const n=r[appState.colMaps[ct].song]||r[appState.colMaps[ct].album]||r[appState.colMaps[ct].artist];
                        const a=r[appState.colMaps[ct].artist]||'Unknown';
                        if(!n) return;
                        const key=`${n.toLowerCase()}:${a.toLowerCase()}`;
                        if(!appState.chartRunData[ct][key]) appState.chartRunData[ct][key]=[];
                        appState.chartRunData[ct][key].push({ date:d, position:parseInt(r[appState.colMaps[ct].position])||0, peak:parseInt(r[appState.colMaps[ct].peak])||0, weeks:parseInt(r[appState.colMaps[ct].weeks])||0, name:n, artist:a });
                    });
                    for(let k in appState.chartRunData[ct]) appState.chartRunData[ct][k].sort((a,b)=>new Date(a.date)-new Date(b.date));
                    const dates = Object.keys(appState.chartData[ct]);
                    if(dates.length) {
                        const last = dates[dates.length-1];
                        const recent = appState.chartData[ct][last];
                        if(recent?.length) {
                            const cm = appState.colMaps[ct];
                            appState.top3Data[ct] = recent.sort((a,b)=>parseInt(a[cm.position])-parseInt(b[cm.position])).slice(0,3).map(r=>({
                                position: r[cm.position]||0, artist: r[cm.artist]||'Unknown',
                                name: (ct==='songs'||ct==='radioSongs')?r[cm.song]:(ct==='albums'||ct==='topStreamingAlbums'||ct==='topAlbumSales')?r[cm.album]:r[cm.artist],
                                weeksAt1: r[cm.weeksAt1]||0, units: r[cm.units]||null, totalUnits: r[cm.totalUnits]||null
                            }));
                        }
                    }
                }
                chartsConfig[ct].loaded = true;
                console.log(`✅ Loaded ${ct}`);
                return true;
            } catch(e) { console.error(`❌ Error loading ${ct}:`, e); return false; }
        }

            <div><h3 class="text-lg md:text-xl font-bold mb-4 md:mb-6 section-title text-white">All Articles</h3><div class="space-y-4 md:space-y-6">${arts.length?arts.map((a,i)=>`<div class="blog-card bg-black rounded-lg border border-gray-800 p-3 md:p-4 shadow-sm"><div class="flex flex-col sm:flex-row"><div class="sm:w-1/4 mb-3 sm:mb-0"><img src="${a.imageUrl||'https://via.placeholder.com/400x200?text=No+Image'}" class="w-full h-24 sm:h-32 object-cover rounded" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'"></div><div class="sm:w-3/4 sm:pl-4 md:pl-6"><span class="text-xs text-accent font-semibold">${a.publicationDate}</span><h4 class="font-bold text-base md:text-lg mt-1 mb-2 text-white break-text">${a.title}</h4><p class="text-gray-400 text-xs md:text-sm line-clamp-3">${a.fullText.substring(0,150)}...</p><div class="tag-container mt-2">${a.artist?`<span class="tag" data-tag="#${a.artist.toLowerCase()}">#${a.artist.toLowerCase()}</span>`:''}</div><button class="read-more-btn mt-2 md:mt-3 text-accent text-xs md:text-sm font-semibold" data-blog="${appState.currentBlog}" data-idx="${i}">Read More <i class="fas fa-arrow-right ml-1 text-xs"></i></button></div></div></div>`).join(''):`<div class="text-center py-6 md:py-8 text-gray-400"><i class="fas fa-newspaper text-3xl md:text-4xl mb-3"></i><p class="text-sm md:text-base">No articles available</p></div>`}</div></div></div>`;
            document.getElementById('backBtn')?.addEventListener('click',()=>navigateBack());
            document.querySelectorAll('.chart-beat-nav-btn').forEach(b=>b.addEventListener('click',()=>{ appState.currentBlog=b.dataset.blog; appState.activeTag=null; renderChartBeatPage(); }));
            document.querySelectorAll('.tag').forEach(t=>t.addEventListener('click',(e)=>{ e.stopPropagation(); appState.activeTag=t.dataset.tag; renderChartBeatPage(); }));
            document.querySelector('.clear-filter')?.addEventListener('click',()=>{ appState.activeTag=null; renderChartBeatPage(); });
            document.querySelectorAll('.read-more-btn').forEach(b=>b.addEventListener('click',()=>renderArticleModal(b.dataset.blog,parseInt(b.dataset.idx))));
            setupBackToTop();
        }
        
        function renderArticleModal(blog,idx){
            const art = appState.chartBeatData[blog]?.[idx];
            if(!art) return;
            let txt = art.fullText;
            txt = txt.replace(/\b(\w+'\w+)\b/g,'<strong>$1</strong>').replace(/\b(\d+)\b/g,'<em>$1</em>').replace(/\b(\w+(?:\s+\w+)*)\s+by\s+(\w+(?:\s+\w+)*)\b/gi,'<strong>$1</strong> by <strong>$2</strong>');
            modalContent.innerHTML = `<div><div class="mb-4"><img src="${art.imageUrl||'https://via.placeholder.com/800x400?text=No+Image'}" class="w-full h-48 md:h-64 object-cover rounded-lg mb-4" onerror="this.src='https://via.placeholder.com/800x400?text=No+Image'"><span class="text-xs md:text-sm text-accent font-semibold">${art.publicationDate}</span><h3 class="text-xl md:text-2xl font-bold mt-1 mb-3 text-black break-text">${art.title}</h3><p class="text-gray-800 text-sm md:text-base whitespace-pre-line" style="text-align:justify">${txt}</p>${art.artist?`<div class="mt-4 flex flex-wrap gap-2"><span class="tag" data-tag="#${art.artist.toLowerCase()}">#${art.artist.toLowerCase()}</span></div>`:''}${art.chartLink?`<div class="mt-6 md:mt-8 text-center"><button class="px-3 md:px-4 py-2 bg-accent text-black rounded-md hover:bg-accent-dark transition-colors text-sm md:text-base" onclick="showChart('${art.chartLink}','${art.publicationDate}')">See the full chart <i class="fas fa-arrow-right ml-2"></i></button></div>`:''}</div></div>`;
            modal.classList.add('active');
            document.querySelectorAll('.tag').forEach(t=>t.addEventListener('click',(e)=>{ e.stopPropagation(); modal.classList.remove('active'); appState.activeTag=t.dataset.tag; renderChartBeatPage(); }));
        }
        
        function showChart(ct, dateToSet=null){
            if(appState.currentView === 'chart' && appState.activeChart) {
                appState.navigationHistory.push({ view: 'chart', chart: appState.activeChart, date: appState.currentDate, year: appState.currentYear });
            }
            appState.activeChart = ct;
            appState.currentView = 'chart';
            const isYear = ct.includes('yearEnd'), isGoat = ct.includes('goat');
            if(isYear){
                let years = Object.keys(appState.chartData[ct]||{}).sort((a,b)=>b-a);
                appState.currentYear = years[0]||new Date().getFullYear().toString();
            } else {
                let dates = Object.keys(appState.chartData[ct]||{});
                let recent = dates.length?dates[dates.length-1]:null;
                if(dateToSet && appState.chartData[ct]?.[dateToSet]) appState.currentDate = dateToSet;
                else if(appState.sharedDate && appState.chartData[ct]?.[appState.sharedDate]) appState.currentDate = appState.sharedDate;
                else appState.currentDate = recent;
                appState.sharedDate = appState.currentDate;
            }
            const nav = isYear?Object.entries(chartsConfig).filter(([k])=>k.includes('yearEnd')):isGoat?Object.entries(chartsConfig).filter(([k])=>k.includes('goat')):Object.entries(chartsConfig).filter(([k])=>!k.includes('yearEnd')&&!k.includes('goat')&&k!=='artistStats');
            appContainer.innerHTML = `<div class="max-w-4xl mx-auto"><button id="backBtn" class="back-button mb-4 md:mb-6 flex items-center text-accent hover:text-accent-dark font-semibold transition-colors text-sm md:text-base"><i class="fas fa-arrow-left mr-2"></i> Back</button>
            <div class="mb-4 md:mb-6"><h2 class="text-xl md:text-3xl font-bold text-center mb-2 text-white">${isYear?'Year-End Charts':isGoat?'Greatest of All Time':'Weekly Charts'}</h2><div id="chartNav" class="flex flex-wrap justify-center gap-2 border-b border-gray-800 pb-3">${nav.map(([k,c])=>`<button data-chart="${k}" class="chart-nav-btn btn-hover ${appState.activeChart===k?(isGoat?'goat-active':'active'):''} text-xs md:text-sm font-semibold py-2 px-3 rounded-md transition-all">${c.title}</button>`).join('')}</div></div>
            <div class="mb-4 md:mb-6"><h3 class="text-lg md:text-xl font-bold text-center mb-3 md:mb-4 text-white">${chartsConfig[appState.activeChart]?.title||''}</h3>
            ${isYear?`<div class="flex justify-center mb-4"><div class="year-selector">${Object.keys(appState.chartData[ct]||{}).sort((a,b)=>b-a).map(y=>`<button class="year-btn ${y===appState.currentYear?'active':''}" data-year="${y}">${y}</button>`).join('')}</div></div>`:isGoat?'':`<div class="flex flex-col sm:flex-row justify-center items-center gap-2 sm:gap-4"><div class="flex items-center gap-2 text-white"><label class="text-xs md:text-sm text-gray-400 font-medium">Week:</label><button id="prevBtn" class="p-1 md:p-2 rounded-md bg-gray-800 hover:bg-gray-700 disabled:opacity-50 btn-hover"><i class="fas fa-chevron-left text-xs md:text-sm"></i></button><input type="text" id="weekPicker" class="flatpickr-input text-xs md:text-sm" placeholder="Select date"><button id="nextBtn" class="p-1 md:p-2 rounded-md bg-gray-800 hover:bg-gray-700 disabled:opacity-50 btn-hover"><i class="fas fa-chevron-right text-xs md:text-sm"></i></button></div></div>`}
            <div class="chart-container" id="chartContainer">${renderChartItems()}</div>
            ${!isYear&&!isGoat?`<div class="text-center mt-4 md:mt-6"><button id="topBtn" class="px-3 md:px-4 py-1 md:py-2 bg-accent text-black rounded-md hover:bg-accent-dark btn-hover text-xs md:text-sm"><i class="fas fa-arrow-up mr-1 md:mr-2"></i> Back to Top</button></div>`:''}</div>`;
            setupChartListeners();
            setTimeout(()=>loadImages(),50);
            setupBackToTop();
            if(!isYear && !isGoat){
                let dates = Object.keys(appState.chartData[ct]||{});
                if(dates.length){
                    flatpickr("#weekPicker", { enable: dates, defaultDate: appState.currentDate, dateFormat: "Y-m-d", onChange: (_,ds)=>{ if(ds){ appState.currentDate=ds; appState.sharedDate=ds; document.getElementById('chartContainer').innerHTML=renderChartItems(); updateNavButtons(); setTimeout(()=>loadImages(),50); } } });
                }
            }
            if(isYear) document.querySelectorAll('.year-btn').forEach(b=>b.addEventListener('click',function(){ appState.currentYear=this.dataset.year; document.querySelectorAll('.year-btn').forEach(x=>x.classList.remove('active')); this.classList.add('active'); document.getElementById('chartContainer').innerHTML=renderChartItems(); setTimeout(()=>loadImages(),50); }));
            ['prevBtn','nextBtn'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>navigateWeek(id.includes('prev')?-1:1)));
        }
        
        function navigateWeek(delta){
            let dates = Object.keys(appState.chartData[appState.activeChart]||{}).sort();
            let idx = dates.indexOf(appState.currentDate);
            let nidx = idx+delta;
            if(nidx>=0 && nidx<dates.length){
                appState.currentDate = dates[nidx];
                appState.sharedDate = appState.currentDate;
                document.getElementById('chartContainer').innerHTML = renderChartItems();
                updateNavButtons();
                setTimeout(()=>loadImages(),50);
                if(window.flatpickr) document.getElementById('weekPicker')?._flatpickr?.setDate(appState.currentDate);
            }
        }
        
        function updateNavButtons(){
            let dates = Object.keys(appState.chartData[appState.activeChart]||{}).sort();
            let idx = dates.indexOf(appState.currentDate);
            ['prevBtn'].forEach(id=>{ let b=document.getElementById(id); if(b) b.disabled = idx<=0; });
            ['nextBtn'].forEach(id=>{ let b=document.getElementById(id); if(b) b.disabled = idx>=dates.length-1; });
        }
        
        function renderChartItems(){
            let ct=appState.activeChart, cm=appState.colMaps[ct]||{}, items=[], isYear=ct.includes('yearEnd'), isGoat=ct.includes('goat');
            if(isYear){ let yd=appState.chartData[ct]?.[appState.currentYear]; if(!yd) return '<div class="text-center p-8 text-gray-400">No data</div>'; items=yd; }
            else if(isGoat){ items=appState.chartData[ct]||[]; if(!items.length) return '<div class="text-center p-8 text-gray-400">No data</div>'; }
            else{ if(!appState.currentDate||!appState.chartData[ct]?.[appState.currentDate]) return '<div class="text-center p-8 text-gray-400">No data</div>'; items=appState.chartData[ct][appState.currentDate]; }
            let sorted = [...items].sort((a,b)=>(parseInt(a[cm.position])||999)-(parseInt(b[cm.position])||999)).slice(0,100);
            if(!sorted.length) return '<div class="text-center p-8 text-gray-400">No data</div>';
            return sorted.map((row,idx)=>{
                let pos=parseInt(row[cm.position])||0, artist=row[cm.artist]||'Unknown', diff=cm.diff!==-1?row[cm.diff]:null;
                let lw=cm.lastWeek!==-1&&!isYear&&!isGoat?row[cm.lastWeek]:null, pk=cm.peak!==-1?parseInt(row[cm.peak]):null, wks=cm.weeks!==-1?parseInt(row[cm.weeks]):null;
                let w1=cm.weeksAt1!==-1?parseInt(row[cm.weeksAt1]):null, units=cm.units!==-1?row[cm.units]:null, total=cm.totalUnits!==-1?row[cm.totalUnits]:null;
                let name = (ct.includes('Songs')||ct==='songs'||ct==='radioSongs')?(row[cm.song]||'Unknown'):(ct.includes('Albums')||ct==='albums'||ct==='topStreamingAlbums'||ct==='topAlbumSales')?(row[cm.album]||'Unknown'):(row[cm.artist]||'Unknown');
                let diffClass='', diffSym='';
                if(diff){ 
                    let l=diff.toString().toLowerCase(); 
                    if(l.includes('▲')||l.includes('+')){ diffClass='diff-up'; diffSym='▲'; } 
                    else if(l.includes('▼')||l.includes('-')){ diffClass='diff-down'; diffSym='▼'; } 
                    else if(l.includes('new')){ diffClass='diff-new'; diffSym='NEW'; } 
                    else if(l.includes('re')){ diffClass='diff-new'; diffSym='RE'; } 
                    else if(l==='0') diffSym='='; 
                }
                let newPeak='', w1badge='';
                if(!isYear&&!isGoat&&pk&&pos<pk){ let isNew=(diff?.toLowerCase()==='new'||diff?.toLowerCase()==='re'||lw?.toString()==='0'); if(!isNew) newPeak='<span class="badge badge-new-peak">NEW PEAK</span>'; }
                if(w1&&w1>0) w1badge=`<span class="badge badge-weeks-at-1">${w1} WK${w1>1?'S':''} AT #1</span>`;
                let unitsDisplay='';
                if(units && units!=='0'){
                    if(ct==='radioSongs') unitsDisplay='';
                    else if(ct==='topStreamingAlbums') unitsDisplay=`<span class="text-xs text-muted-item">Streaming: <span class="font-semibold">${units}</span></span>`;
                    else if(ct==='topAlbumSales') unitsDisplay=`<span class="text-xs text-muted-item">Sales: <span class="font-semibold">${units}</span></span>`;
                    else unitsDisplay=`<span class="text-xs text-muted-item">Units: <span class="font-semibold">${units}</span></span>`;
                }
                let totalDisplay = total?`<span class="text-xs text-muted-item">Total: <span class="font-semibold">${total}</span></span>`:'';
                let artistDisplay = (ct==='artists'||ct==='yearEndArtists'||ct==='goatArtists')?`<p class="text-gray-600 text-sm mb-2"><button class="text-accent hover:text-accent-dark text-xs font-semibold artist-page-link" data-artist="${artist}">View Artist Page <i class="fas fa-arrow-right text-xs ml-1"></i></button></p>`:`<p class="text-gray-600 text-sm mb-2"><span class="artist-link font-medium" data-artist="${artist}">${artist}</span></p>`;
                let runKey = `${name.toLowerCase()}:${artist.toLowerCase()}`;
                let run = appState.chartRunData[ct]?.[runKey]||[];
                return `<div class="chart-card-item ${pos===1?(isGoat?'rank-1 goat':'rank-1'):''}" data-chart="${ct}" data-date="${appState.currentDate}"><div class="flex items-start"><div class="rank-number">${pos}${diffSym?`<span class="diff-indicator ${diffClass}">${diffSym}</span>`:''}</div><div class="mx-3 md:mx-4"><div class="spotify-image" id="img-${ct}-${idx}"><div class="w-full h-full placeholder-art"><i class="fas ${chartsConfig[ct]?.icon||'fa-music'} text-gray-600"></i></div></div></div><div class="flex-grow"><div class="flex justify-between"><div class="flex-grow pr-2"><div class="flex flex-wrap gap-1 mb-1"><p class="font-bold text-base md:text-lg"><span class="artist-link cursor-pointer" data-artist="${artist}" data-item="${name}" data-type="${ct.includes('Albums')||ct.includes('topStreaming')||ct.includes('topAlbumSales')?'album':'song'}">${name}</span></p></div>${artistDisplay}<div class="flex flex-wrap gap-2 mb-2">${w1badge}${newPeak}</div><div class="flex flex-col gap-1">${unitsDisplay}${totalDisplay}</div></div>${!isYear&&!isGoat?`<div class="chart-stats-vertical">${lw!==undefined?`<span>LW<span class="stat-value">${lw==='0'||lw?.toLowerCase()==='re'?'-':lw}</span></span>`:''}${pk?`<span>PK<span class="stat-value">${pk}</span></span>`:''}${wks?`<span>WOC<span class="stat-value">${wks}</span></span>`:''}</div>`:isGoat||isYear?`<div class="chart-stats-vertical">${pk?`<span>PK<span class="stat-value">${pk}</span></span>`:''}${wks?`<span>WKS<span class="stat-value">${wks}</span></span>`:''}</div>`:''}</div>${run.length?`<div class="mt-3 text-xs"><button class="text-accent chart-run-link" data-chart="${ct}" data-key="${runKey}">View Chart Run <i class="fas fa-arrow-right text-xs ml-1"></i></button></div>`:''}</div></div></div>`;
            }).join('');
        }
        
        function setupChartListeners(){
            document.getElementById('backBtn')?.addEventListener('click',()=>navigateBack());
            document.querySelectorAll('.chart-nav-btn').forEach(b=>b.addEventListener('click',()=>showChart(b.dataset.chart)));
            setTimeout(()=>{
                document.querySelectorAll('.artist-link, .artist-page-link').forEach(l=>l.addEventListener('click',(e)=>{ e.stopPropagation(); renderArtistPage(l.dataset.artist); }));
                document.querySelectorAll('.chart-run-link').forEach(b=>{ let ct=b.dataset.chart, key=b.dataset.key; b.addEventListener('click',()=>showRunModal(ct,key)); });
                document.querySelectorAll('.chart-card-item').forEach(c=>c.addEventListener('click',function(e){ if(!e.target.closest('.artist-link')&&!e.target.closest('.chart-run-link')) showChart(this.dataset.chart, this.dataset.date); }));
            },100);
        }
        
        function showRunModal(ct,key){
            let run = appState.chartRunData[ct]?.[key]||[];
            let [name,artist] = key.split(':');
            if(!run.length) modalContent.innerHTML='<p class="text-center text-gray-400">No chart run data.</p>';
            else{
                modalContent.innerHTML = `<h3 class="text-xl md:text-2xl font-bold mb-4 text-black">${name} by ${artist} - Chart Run</h3><div class="chart-run-grid">${run.map((r,i,a)=>{ let cls='run-steady'; if(i>0){ if(r.position<a[i-1].position) cls='run-up'; else if(r.position>a[i-1].position) cls='run-down'; } if(r.position===r.peak&&i>0&&r.position<a[i-1].peak) cls='run-peak'; if(r.position===1) cls='run-number-one'; if(i===0) cls='run-new'; return `<div class="chart-run-card ${cls}"><div class="chart-run-date"><button class="date-link" onclick="goToWeek('${ct}','${r.date}')">${r.date}</button></div><div class="flex justify-between"><span class="chart-run-position">#${r.position}</span>${cls==='run-up'?'▲':cls==='run-down'?'▼':''}${r.position===r.peak&&i>0?'<span class="chart-run-peak-badge">NEW PEAK</span>':''}${i===0?'<span class="chart-run-new-badge">DEBUT</span>':''}</div></div>`; }).join('')}</div>`;
            }
            modal.classList.add('active');
        }
        
        function goToWeek(ct,date){ appState.currentDate=date; showChart(ct,date); modal.classList.remove('active'); }
        
        async function loadImages(){
            let ct=appState.activeChart, cm=appState.colMaps[ct]||{}, items=[];
            if(ct.includes('yearEnd')) items=appState.chartData[ct]?.[appState.currentYear]||[];
            else if(ct.includes('goat')) items=appState.chartData[ct]||[];
            else items=appState.chartData[ct]?.[appState.currentDate]||[];
            for(let i=0;i<items.length;i++){
                let row=items[i], artist=row[cm.artist]||'Unknown', q='', t='';
                if(ct.includes('Songs')||ct==='songs'||ct==='radioSongs'){ q=artist; t='artist'; }
                else if(ct.includes('Albums')||ct==='albums'||ct==='topStreamingAlbums'||ct==='topAlbumSales'){ let alb=row[cm.album]||''; q=`${artist} ${alb}`; t='album'; }
                else{ q=artist; t='artist'; }
                if(q && q!=='Unknown'){
                    let url = await getSpotifyImage(q,t);
                    let el = document.getElementById(`img-${ct}-${i}`);
                    if(el && url){ el.innerHTML=`<img src="${url}" class="w-full h-full object-cover">`; el.classList.remove('placeholder-art'); }
                }
            }
        }
        
        function renderArtistPage(artist){
            let data = appState.artistDetailsData[artist];
            if(!data){ appContainer.innerHTML=`<div class="max-w-4xl mx-auto text-center p-6"><button id="backBtn" class="mb-4 text-accent"><i class="fas fa-arrow-left mr-2"></i> Back</button><i class="fas fa-user-circle text-5xl text-gray-600 mb-4"></i><h2 class="text-2xl font-bold text-white">Artist not found</h2></div>`; document.getElementById('backBtn')?.addEventListener('click',navigateBack); return; }
            getSpotifyImage(artist,'artist').then(img=>{
                let sections = ['Top 50 Artists','Hot 100 Songs','Radio Songs','Top 100 Albums','Top Streaming Albums','Top Album Sales'].map(name=>{
                    let cd = data[name];
                    if(!cd||cd.count===0) return '';
                    let isArtist = name==='Top 50 Artists';
                    return `<div class="artist-list-card mb-6"><div class="artist-list-header"><h3 class="font-bold text-gray-800">${name}</h3><p class="text-xs text-gray-500">${isArtist?`Peak #${cd.entries[0]?.peak||0} / ${cd.entries[0]?.weeks||0} Weeks`:`${cd.count} Entries / ${cd.numberOnes} #1's / ${cd.topTens} Top 10's`}</p></div>${!isArtist?`<div class="divide-y">${cd.entries.slice(0,20).map(e=>`<div class="artist-list-item"><div><span class="font-medium">${e.item}</span>${e.unitsSold?`<span class="text-xs text-gray-500 ml-2">${e.unitsSold}</span>`:''}${e.totalUnits?`<span class="units-badge text-xs">${e.totalUnits} total</span>`:''}</div><div class="flex gap-3"><span class="text-xs text-gray-500">Peak #${e.peak}</span><span class="text-xs text-gray-500">${e.weeks} wks</span></div></div>`).join('')}${cd.entries.length>20?`<div class="text-center py-2 text-xs text-gray-400">... and ${cd.entries.length-20} more</div>`:''}</div>`:''}</div>`;
                }).join('');
                appContainer.innerHTML = `<div class="max-w-4xl mx-auto"><button id="backBtn" class="back-button mb-4 text-accent"><i class="fas fa-arrow-left mr-2"></i> Back</button>${img?`<img src="${img}" class="artist-header-image">`:`<div class="artist-header-image placeholder-art flex items-center justify-center"><i class="fas fa-user text-4xl text-gray-500"></i></div>`}<h1 class="artist-name-large">${artist}</h1><p class="text-gray-400 text-sm mb-6">Detailed Chart History</p><div>${sections}</div></div>`;
                document.getElementById('backBtn')?.addEventListener('click',()=>navigateBack());
                setupBackToTop();
            });
        }
        
        function showAllArtists(){
            appState.currentView='allArtists';
            let artists = appState.allArtistsList;
            appContainer.innerHTML = `<div class="max-w-6xl mx-auto"><button id="backBtn" class="back-button mb-4 text-accent"><i class="fas fa-arrow-left mr-2"></i> Back to Home</button><h2 class="text-2xl font-bold mb-4 section-title">All Artists Entries</h2><div class="search-container mb-4"><i class="fas fa-search search-icon"></i><input type="text" id="artistSearch" class="search-input text-sm" placeholder="Search artists..."></div><div id="artistsGrid" class="artists-icons-grid">${artists.map(a=>`<div class="artist-icon-card" data-artist="${a}"><div class="artist-icon-placeholder" id="icon-${a.replace(/[^a-z0-9]/gi,'_')}"><i class="fas fa-user"></i></div><div class="artist-icon-name">${a}</div></div>`).join('')}</div></div>`;
            document.getElementById('backBtn')?.addEventListener('click',()=>navigateBack());
            document.getElementById('artistSearch').addEventListener('input',function(){
                let term=this.value.toLowerCase();
                let filtered=artists.filter(a=>a.toLowerCase().includes(term));
                document.getElementById('artistsGrid').innerHTML=filtered.map(a=>`<div class="artist-icon-card" data-artist="${a}"><div class="artist-icon-placeholder" id="icon-${a.replace(/[^a-z0-9]/gi,'_')}"><i class="fas fa-user"></i></div><div class="artist-icon-name">${a}</div></div>`).join('');
                attachArtistClicks();
                loadArtistIcons(filtered);
            });
            attachArtistClicks();
            loadArtistIcons(artists);
            setupBackToTop();
        }
        
        function attachArtistClicks(){ document.querySelectorAll('.artist-icon-card').forEach(c=>c.addEventListener('click',()=>renderArtistPage(c.dataset.artist))); }
        
        async function loadArtistIcons(artists){
            for(let a of artists){
                let url = await getSpotifyImage(a,'artist');
                let el = document.getElementById(`icon-${a.replace(/[^a-z0-9]/gi,'_')}`);
                if(el && url){ el.innerHTML=`<img src="${url}" class="artist-icon-image">`; el.classList.remove('artist-icon-placeholder'); }
            }
        }
        
        function navigateBack(){
            let prev = appState.navigationHistory.pop();
            if(prev?.view==='chart') showChart(prev.chart, prev.date);
            else if(prev?.view==='artist') renderArtistPage(prev.artist);
            else if(prev?.view==='allArtists') showAllArtists();
            else if(prev?.view==='chartBeat') renderChartBeatPage();
            else if(prev?.view==='about') renderAboutPage();
            else renderHome();
        }
        
        function setupBackToTop(){
            let existing = document.querySelector('.back-to-top');
            if(existing) existing.remove();
            let btn = document.createElement('button');
            btn.className='back-to-top'; btn.innerHTML='<i class="fas fa-arrow-up"></i>';
            document.body.appendChild(btn);
            window.addEventListener('scroll',()=>{ if(window.scrollY>300){ btn.style.display='flex'; setTimeout(()=>btn.classList.add('visible'),10); } else{ btn.classList.remove('visible'); setTimeout(()=>{if(!btn.classList.contains('visible')) btn.style.display='none';},300); } });
            btn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        }
        
        async function init(){
            showMessage('loading','Loading charts data...');
            try{
                const allCharts = [...weeklyChartList, ...yearEndList, ...goatList, 'artistStats'];
                for(let ct of allCharts) await fetchChartData(ct);
                await fetchChartBeat();
                let years = Object.keys(appState.chartData.yearEndSongs||{}).sort((a,b)=>b-a);
                if(years.length) appState.currentYear = years[0];
                for(let ct of weeklyChartList) {
                    let dates = Object.keys(appState.chartData[ct]||{});
                    if(dates.length) {
                        appState.sharedDate = dates[dates.length-1];
                        break;
                    }
                }
                renderHome();
            } catch(e){ console.error(e); showMessage('error','Error loading data: '+e.message); }
        }
        
        document.addEventListener('DOMContentLoaded',()=>{
            init();
            document.getElementById('mainTitle').addEventListener('click',()=>{ appState.navigationHistory=[]; renderHome(); });
            document.getElementById('navAbout').addEventListener('click',()=>renderAboutPage());
            document.getElementById('navAllArtists').addEventListener('click',()=>showAllArtists());
            document.getElementById('navChartBeat').addEventListener('click',()=>showChartBeat('hot100'));
            closeModal.addEventListener('click',()=>modal.classList.remove('active'));
            modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('active'); });
        });
    </script>
</body>
</html>
