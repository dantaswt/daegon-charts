<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daegon charts</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/jaBZ19n.png">
    
    <!-- CSS Externo -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body class="flex flex-col min-h-screen">
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-20 shadow-sm">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-extrabold">
                <span class="gradient-text cursor-pointer" id="mainTitle">daegon charts</span>
            </h1>
            <nav class="flex space-x-4">
                <button id="navAllEntries" class="text-sm font-semibold text-gray-300 hover:text-accent transition-colors">
                    All Entries
                </button>
                <button id="navChartBeat" class="text-sm font-semibold text-gray-300 hover:text-accent transition-colors">
                    Chart Beat
                </button>
            </nav>
        </div>
    </header>

    <main id="app" class="flex-grow container mx-auto p-4 md:p-6">
    </main>

    <footer class="bg-gray-800 mt-8 py-6 border-t border-gray-700">
        <div class="container mx-auto px-4 text-center text-gray-400 text-sm">
            <p>Chart generated based on dantaswt's Last.fm data</p>
            <p class="mt-2">Developed with <i class="fas fa-heart text-red-500"></i> using HTML, CSS & JavaScript</p>
        </div>
    </footer>

    <div class="item-details-modal" id="itemDetailsModal">
        <div class="modal-content w-full max-w-2xl">
            <button class="close-modal" id="closeModal">×</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/config.js"></script>
    <script src="js/spotify.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/renderers.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>

<!-- Adicione antes do fechamento do </body> -->
<script>
    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('ServiceWorker registered');
                })
                .catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
        });
    }
</script>
    <!-- Adicione antes do fechamento do </body> -->
<div id="progressLoader" class="fixed top-0 left-0 w-full h-1 bg-gray-800 z-50 hidden">
    <div id="progressBar" class="h-full bg-accent transition-all duration-300" style="width: 0%"></div>
</div>

<script>
// Sistema de progresso
let loadingProgress = 0;
const progressBar = document.getElementById('progressBar');
const progressLoader = document.getElementById('progressLoader');

window.updateProgress = (percent, message) => {
    loadingProgress = percent;
    if (progressBar) {
        progressBar.style.width = percent + '%';
    }
    if (percent >= 100) {
        setTimeout(() => {
            progressLoader.classList.add('hidden');
        }, 500);
    } else {
        progressLoader.classList.remove('hidden');
    }
};

// Mostrar progresso durante o carregamento
window.showGlobalLoader = (message) => {
    updateProgress(0);
};

window.hideGlobalLoader = () => {
    updateProgress(100);
};
</script>
</body>
</html>
