<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daegon charts — Weekly Charts</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/jaBZ19n.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #FFD700;
      --bg: #000;
      --panel: #101010;
      --panel-2: #171717;
      --border: #2a2a2a;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
    }
    .gold { color: var(--gold); }
    .chart-tab {
      border: 1px solid var(--border);
      background: var(--panel);
      color: #d1d5db;
      border-radius: 999px;
      padding: .55rem .85rem;
      font-size: .78rem;
      font-weight: 700;
      white-space: nowrap;
      transition: .2s;
    }
    .chart-tab:hover { border-color: var(--gold); color: #fff; }
    .chart-tab.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .chart-row {
      background: #fff;
      color: #111827;
      border-radius: 12px;
      padding: .9rem;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: .8rem;
      align-items: center;
    }
    .rank {
      font-size: 1.3rem;
      font-weight: 800;
      text-align: center;
    }
    .meta {
      color: #6b7280;
      font-size: .72rem;
      line-height: 1.35;
    }
    .stats {
      text-align: right;
      color: #6b7280;
      font-size: .68rem;
      line-height: 1.45;
      min-width: 68px;
    }
    .stats strong { color: #111827; }
    .loader {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.15);
      border-top-color: var(--gold);
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    select {
      background: var(--panel-2);
      color: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .6rem .8rem;
      font-size: .8rem;
    }
    @media (max-width: 640px) {
      .chart-row {
        grid-template-columns: 40px minmax(0, 1fr) auto;
        padding: .75rem;
        gap: .65rem;
      }
      .rank { font-size: 1.15rem; }
      .stats { font-size: .64rem; min-width: 62px; }
    }
  </style>
</head>
<body>
  <header class="border-b border-neutral-900 sticky top-0 bg-black/95 backdrop-blur z-20">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <h1 class="text-center text-2xl md:text-3xl font-extrabold gold">daegon charts</h1>
      <p class="text-center text-xs text-gray-500 mt-1">Weekly Charts</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-5 md:py-7">
    <div id="tabs" class="flex gap-2 overflow-x-auto pb-3"></div>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mt-2 mb-5">
      <div>
        <h2 id="chartTitle" class="text-xl md:text-2xl font-extrabold"></h2>
        <p id="chartStatus" class="text-xs text-gray-500 mt-1"></p>
      </div>
      <select id="weekSelect" class="hidden"></select>
    </div>

    <div id="content" class="space-y-3">
      <div class="flex justify-center py-16"><div class="loader"></div></div>
    </div>
  </main>

  <script>
    const SHEET = 'https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=';

    const charts = {
      songs: { title: 'Hot 100', gid: '904867620', kind: 'song' },
      artists: { title: 'Artist 50', gid: '1568177610', kind: 'artist' },
      albums: { title: 'Top 100 Albums', gid: '1940039611', kind: 'album' },
      radioSongs: { title: 'Radio Songs', gid: '1681272096', kind: 'song' },
      topStreamingAlbums: { title: 'Top Streaming Albums', gid: '1028545573', kind: 'album' },
      topAlbumSales: { title: 'Top Album Sales', gid: '1111633725', kind: 'album' },
      streamingSongs: { title: 'Streaming Songs', gid: '626144821', kind: 'song' },
      digitalSongsSales: { title: 'Digital Songs Sales', gid: '302176914', kind: 'song' }
    };

    const state = {
      active: 'songs',
      cache: new Map()
    };

    const tabs = document.getElementById('tabs');
    const titleEl = document.getElementById('chartTitle');
    const statusEl = document.getElementById('chartStatus');
    const weekSelect = document.getElementById('weekSelect');
    const content = document.getElementById('content');

    function parseCsvRow(line) {
      const out = [];
      let cur = '';
      let quoted = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (quoted && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if (ch === ',' && !quoted) {
          out.push(cur);
          cur = '';
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out;
    }

    function normalizeDate(value) {
      if (!value) return '';
      const v = value.trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
      const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
      return v;
    }

    function findIndex(header, names) {
      for (const name of names) {
        const i = header.indexOf(name);
        if (i !== -1) return i;
      }
      return -1;
    }

    function formatDate(date) {
      const d = new Date(date + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return date;
      return new Intl.DateTimeFormat('en-GB', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      }).format(d);
    }

    async function fetchChart(id) {
      if (state.cache.has(id)) return state.cache.get(id);

      const cfg = charts[id];
      const url = SHEET + cfg.gid + '&_=' + Date.now();

      const response = await Promise.race([
        fetch(url),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 15000))
      ]);

      if (!response.ok) throw new Error('HTTP ' + response.status);

      let csv = await response.text();
      if (csv.charCodeAt(0) === 0xFEFF) csv = csv.slice(1);

      const lines = csv.trim().split(/\r?\n/);
      const rows = lines.map(parseCsvRow);
      if (rows.length < 2) throw new Error('No data');

      const header = rows[0].map(x => x.toLowerCase().trim());
      const idx = {
        date: findIndex(header, ['date','chart date']),
        position: findIndex(header, ['position','rank','pos']),
        song: findIndex(header, ['song','title','track']),
        album: findIndex(header, ['album']),
        artist: findIndex(header, ['artist','artists']),
        lw: findIndex(header, ['last week','lw']),
        peak: findIndex(header, ['peak']),
        weeks: findIndex(header, ['weeks','wks']),
        weeksAt1: findIndex(header, ['weeks at 1','wks at 1']),
        diff: findIndex(header, ['dif','diff','▲▼']),
        units: findIndex(header, ['units','spins','sales','streams','audience'])
      };

      const byDate = {};
      for (const row of rows.slice(1)) {
        const date = normalizeDate(row[idx.date] || '');
        if (!date) continue;
        if (!byDate[date]) byDate[date] = [];
        byDate[date].push(row);
      }

      for (const date of Object.keys(byDate)) {
        byDate[date].sort((a,b) => (parseInt(a[idx.position]) || 999) - (parseInt(b[idx.position]) || 999));
      }

      const data = {
        idx,
        byDate,
        dates: Object.keys(byDate).sort((a,b) => new Date(a) - new Date(b))
      };

      state.cache.set(id, data);
      return data;
    }

    function renderTabs() {
      tabs.innerHTML = Object.entries(charts).map(([id,cfg]) =>
        `<button class="chart-tab ${id===state.active?'active':''}" data-id="${id}">${cfg.title}</button>`
      ).join('');

      tabs.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => loadChart(btn.dataset.id));
      });
    }

    function value(row, idx) {
      return idx >= 0 ? (row[idx] || '').trim() : '';
    }

    function renderRows(id, data, date) {
      const cfg = charts[id];
      const rows = data.byDate[date] || [];
      const i = data.idx;

      if (!rows.length) {
        content.innerHTML = '<div class="text-center text-gray-500 py-12">No entries for this week.</div>';
        return;
      }

      content.innerHTML = rows.map(row => {
        const pos = value(row, i.position) || '—';
        const artist = value(row, i.artist) || 'Unknown';
        let name = artist;
        if (cfg.kind === 'song') name = value(row, i.song) || 'Unknown';
        if (cfg.kind === 'album') name = value(row, i.album) || 'Unknown';

        const lw = value(row, i.lw) || '—';
        const peak = value(row, i.peak) || pos;
        const weeks = value(row, i.weeks) || '—';
        const weeksAt1 = value(row, i.weeksAt1);
        const units = value(row, i.units);

        return `
          <div class="chart-row">
            <div class="rank">${pos}</div>
            <div class="min-w-0">
              <div class="font-extrabold text-sm md:text-base truncate">${escapeHtml(name)}</div>
              ${cfg.kind !== 'artist' ? `<div class="meta truncate">${escapeHtml(artist)}</div>` : ''}
              ${units ? `<div class="meta mt-1">${escapeHtml(units)}</div>` : ''}
            </div>
            <div class="stats">
              <div>LW <strong>${escapeHtml(lw)}</strong></div>
              <div>Peak <strong>${escapeHtml(peak)}</strong></div>
              <div>Weeks <strong>${escapeHtml(weeks)}</strong></div>
              ${weeksAt1 ? `<div>#1 <strong>${escapeHtml(weeksAt1)}</strong></div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function loadChart(id) {
      state.active = id;
      renderTabs();

      const cfg = charts[id];
      titleEl.textContent = cfg.title;
      statusEl.textContent = 'Loading chart...';
      weekSelect.classList.add('hidden');
      content.innerHTML = '<div class="flex justify-center py-16"><div class="loader"></div></div>';

      try {
        const data = await fetchChart(id);
        if (!data.dates.length) throw new Error('No dates');

        const latest = data.dates[data.dates.length - 1];

        weekSelect.innerHTML = data.dates.slice().reverse().map(date =>
          `<option value="${date}">${formatDate(date)}</option>`
        ).join('');
        weekSelect.value = latest;
        weekSelect.classList.remove('hidden');

        statusEl.textContent = formatDate(latest);
        renderRows(id, data, latest);

        weekSelect.onchange = () => {
          statusEl.textContent = formatDate(weekSelect.value);
          renderRows(id, data, weekSelect.value);
          window.scrollTo({top: 0, behavior: 'smooth'});
        };
      } catch (err) {
        statusEl.textContent = '';
        content.innerHTML = `
          <div class="text-center py-14">
            <p class="text-red-400 mb-4">Could not load this chart.</p>
            <button id="retry" class="chart-tab active">Try again</button>
          </div>
        `;
        document.getElementById('retry')?.addEventListener('click', () => {
          state.cache.delete(id);
          loadChart(id);
        });
      }
    }

    renderTabs();
    loadChart('songs');
  </script>
</body>
</html>
