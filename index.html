<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daegon charts — weekly music charts</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/jaBZ19n.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    (function(){
      try{
        var t=localStorage.getItem('theme');
        if(t!=='light') document.documentElement.classList.add('dark');
      }catch(e){}
    })();
  </script>
  <style>
    :root{
      --background:#e8e8e8;
      --foreground:#1a1a1a;
      --card:#ffffff;
      --card-foreground:#1a1a1a;
      --muted:#f0f0f0;
      --muted-foreground:#6b7280;
      --accent:#FF6D00;
      --border:#d4d4d4;
      --border-dark:#c0c0c0;
    }
    html.dark{
      --background:#1a1a1a;
      --foreground:#f5f5f5;
      --card:#0f0f0f;
      --card-foreground:#f5f5f5;
      --muted:#171717;
      --muted-foreground:#9CA3AF;
      --border:#2a2a2a;
      --border-dark:#333333;
    }
    *{box-sizing:border-box;border-radius:0!important}
    html,body{margin:0;background:var(--background);color:var(--foreground);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    body{min-height:100vh}
    button,select{font:inherit}
    button{cursor:pointer}
    .shell{min-height:100vh;display:flex;flex-direction:column}
    .site-header{
      position:fixed;top:0;left:0;right:0;z-index:100;
      background:linear-gradient(to bottom,#0f0f0f,#161616);
      border-bottom:1px solid #2a2a2a;
    }
    .header-inner{
      max-width:1280px;margin:0 auto;padding:12px 16px;
      display:flex;align-items:center;justify-content:space-between;gap:16px;
    }
    .brand{font-size:20px;font-weight:800;color:#f5f5f5;letter-spacing:.02em;text-transform:lowercase}
    .weekly-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#9ca3af}
    .theme-btn{
      width:44px;height:44px;border:1px solid var(--border);background:var(--card);color:var(--foreground);
      display:flex;align-items:center;justify-content:center;transition:.15s;
    }
    .theme-btn:hover{border-color:var(--accent);color:var(--accent)}
    .page{
      flex:1;max-width:1280px;width:100%;margin:0 auto;padding:88px 12px 36px;
    }
    .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px}
    .sidebar{position:sticky;top:96px;align-self:start}
    .chart-nav{display:flex;flex-direction:column;gap:8px}
    .chart-nav button{
      min-height:44px;border:1px solid var(--border);background:var(--muted);color:var(--foreground);
      font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:9px 14px;
      transition:.15s;
    }
    .chart-nav button:hover,.chart-nav button.active{background:var(--accent);color:#000;border-color:var(--accent)}
    .main{min-width:0}
    .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
    h1{margin:0;font-size:36px;line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
    .date-label{margin-top:6px;font-size:13px;color:var(--muted-foreground)}
    .week-nav{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 16px}
    .week-label{font-size:12px;color:var(--muted-foreground);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    .week-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
    .gold-btn{
      min-height:44px;border:0;background:var(--accent);color:#000;font-weight:700;padding:9px 14px;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
    }
    .gold-btn:disabled{opacity:.4;cursor:not-allowed}
    .date-select{
      min-height:44px;border:1px solid var(--border);background:var(--muted);color:var(--foreground);
      font-size:14px;font-weight:800;padding:9px 14px;min-width:175px;text-align:center;
    }
    .filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
    .filter{
      min-height:44px;border:1px solid var(--border);background:var(--muted);color:var(--foreground);
      padding:9px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    }
    .filter.active{background:var(--accent);color:#000;border-color:var(--accent)}
    .chart-list{display:flex;flex-direction:column;gap:12px;max-width:896px;margin:0 auto}
    .chart-card{
      background:var(--card);color:var(--card-foreground);border:1px solid var(--border);
      padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
      transition:transform .18s ease,box-shadow .18s ease;
    }
    .chart-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
    .desktop-row{
      display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;gap:12px;align-items:center;
    }
    .rank-wrap{width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .rank-num{font-size:30px;font-weight:900;min-width:64px;display:flex;align-items:center;justify-content:center}
    .rank-num.one{font-size:36px;width:64px;height:64px;background:var(--accent);color:#000}
    .weeks1{margin-top:3px;padding:2px 6px;background:#FFD600;color:#000;font-size:9px;font-weight:800;text-transform:uppercase;white-space:nowrap}
    .cover{
      width:96px;height:96px;background:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--muted-foreground)
    }
    .cover.one{width:180px;height:180px;border-left:4px solid var(--accent);margin-left:-12px}
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .diff-wrap{width:32px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)}
    .diff-arrow{width:19px;height:19px}
    .diff-badge{font-size:10px;font-weight:800;line-height:1;letter-spacing:.05em}
    .diff-new{background:#00E676;color:#000;padding:3px 5px;writing-mode:horizontal-tb;transform:none}
    .entry{min-width:0}
    .entry-title{font-weight:800;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
    .entry-title.one{font-size:20px}
    .artist{margin-top:3px;color:var(--muted-foreground);font-size:14px;line-height:1.25}
    .artist.one{font-size:16px}
    .badge-inline{display:inline-flex;margin-left:6px;padding:2px 5px;background:#FFD600;color:#000;font-size:9px;font-weight:800;text-transform:uppercase;white-space:nowrap}
    .right{display:flex;align-items:center;gap:16px}
    .award{width:24px;height:24px;border:2px solid currentColor;border-radius:9999px!important;display:flex;align-items:center;justify-content:center}
    .metrics{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted-foreground);white-space:nowrap}
    .metrics .sep{color:var(--border)}
    .actions{display:flex;flex-direction:column;gap:8px}
    .action{
      width:32px;height:32px;border:0;background:var(--muted);color:var(--foreground);
      display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:9999px!important;transition:.15s
    }
    .action:hover{background:var(--border)}
    .details{
      margin-top:12px;border:1px solid var(--border);background:var(--muted);padding:12px;
      font-size:13px;color:var(--foreground)
    }
    .details-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
    .detail-box{background:var(--card);border:1px solid var(--border);padding:9px}
    .detail-k{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground)}
    .detail-v{font-size:13px;font-weight:700;margin-top:3px}
    .dropouts{max-width:896px;margin:28px auto 0;border:1px solid var(--border);background:var(--muted);padding:16px}
    .dropouts-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.2em;color:var(--muted-foreground);margin-bottom:10px}
    .dropout{display:flex;gap:10px;align-items:center;border:1px solid var(--border-dark);background:var(--card);padding:10px;margin-top:8px}
    .dropout-rank{font-weight:800}
    .dropout-info{min-width:0}
    .dropout-name{font-size:13px;font-weight:700}
    .dropout-meta{font-size:10px;color:var(--muted-foreground);margin-top:2px}
    .mobile-row{display:none}
    .back-top{
      position:fixed;right:18px;bottom:20px;z-index:120;width:48px;height:48px;border:0;background:var(--accent);color:#000;
      border-radius:9999px!important;display:none;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.2)
    }
    .loader-wrap{display:flex;justify-content:center;padding:60px 0}
    .loader{width:42px;height:42px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:9999px!important;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{text-align:center;padding:48px 10px;color:var(--muted-foreground)}
    .color-new{background:#bae6fd!important;color:#1a1a1a!important}
    .color-re{background:#93c5fd!important;color:#1a1a1a!important}
    .color-up1{background:#d1fae5!important;color:#1a1a1a!important}
    .color-up10{background:#6ee7b7!important;color:#1a1a1a!important}
    .color-down1{background:#fee2e2!important;color:#1a1a1a!important}
    .color-down10{background:#fca5a5!important;color:#1a1a1a!important}
    .site-footer{margin-top:auto;background:#0f0f0f;border-top:1px solid #2a2a2a;padding:28px 16px;text-align:center;color:#9ca3af;font-size:12px}
    @media(max-width:900px){
      .layout{grid-template-columns:1fr}
      .sidebar{position:static}
      .chart-nav{display:flex;flex-direction:row;overflow-x:auto;gap:0;margin-bottom:6px}
      .chart-nav button{flex:0 0 auto;white-space:nowrap}
    }
    @media(max-width:767px){
      .page{padding-top:80px}
      .header-inner{padding:9px 14px}
      .brand{position:absolute;left:64px;right:64px;text-align:center;font-size:18px}
      .weekly-label{visibility:hidden}
      .title-row{justify-content:center;text-align:center}
      h1{font-size:28px}
      .desktop-row{display:none}
      .mobile-row{display:flex;align-items:flex-start;gap:8px}
      .chart-card{padding:13px 14px}
      .m-rank{width:32px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:2px}
      .m-rank-num{font-size:20px;font-weight:900;line-height:1}
      .m-diff{height:20px;margin-top:3px;display:flex;align-items:center;justify-content:center}
      .m-cover{width:64px;height:64px;background:var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted-foreground)}
      .m-cover.one{width:68px;height:68px;border-left:3px solid var(--accent)}
      .m-cover img{width:100%;height:100%;object-fit:cover}
      .m-entry{min-width:0;flex:1}
      .m-title{font-size:13px;font-weight:800;line-height:1.15;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
      .m-artist{font-size:11px;color:var(--muted-foreground);line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .m-metrics{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--muted-foreground);white-space:nowrap;margin-top:4px}
      .m-actions{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
      .m-actions-top{display:flex;align-items:center;gap:6px}
      .week-nav{margin-top:4px}
      .filters{gap:6px}
      .filter{padding:8px 10px}
    }
  
    .mobile-chart-nav{display:none}
    .mobile-active-chart,.mobile-more-charts,.mobile-chart-menu button{
      width:100%;min-height:44px;border:1px solid var(--border);font-size:14px;font-weight:800;
      text-transform:uppercase;letter-spacing:.04em;padding:9px 14px;
    }
    .mobile-active-chart{background:var(--accent);color:#000;border-color:var(--accent)}
    .mobile-more-charts,.mobile-chart-menu button{background:var(--muted);color:var(--foreground)}
    .mobile-chart-menu{display:none}
    .mobile-chart-menu.open{display:block}
    .mobile-chart-menu button{display:block;border-top:0}
    @media(min-width:768px){
      .desktop-row{display:grid!important}
      .mobile-row{display:none!important}
      .desktop-chart-nav{display:flex!important}
      .mobile-chart-nav{display:none!important}
    }
    @media(max-width:767px){
      .desktop-chart-nav{display:none!important}
      .mobile-chart-nav{display:block!important}
      .desktop-row{display:none!important}
      .mobile-row{display:flex!important}
      .layout{display:block}
      .sidebar{position:static;margin-bottom:12px}
      .page{padding-left:8px;padding-right:8px;padding-top:74px}
      .chart-list{gap:8px}
      .chart-card{padding:10px 9px}
      .title-row{margin-bottom:6px}
      h1{font-size:22px}
      .date-label{font-size:11px}
      .week-nav{margin:6px 0 10px}
      .week-label{font-size:10px}
      .week-controls{gap:6px}
      .gold-btn{min-height:40px;padding:7px 10px;font-size:12px}
      .date-select{min-height:40px;min-width:145px;padding:7px 9px;font-size:12px}
      .filters{margin-bottom:10px}
      .filter{min-height:38px;padding:7px 9px;font-size:10px}
    }

    .week-picker{position:relative;min-width:175px}
    .week-picker-button{
      width:100%;min-width:175px;min-height:44px;
      background:var(--muted);color:var(--foreground);
      border:1px solid var(--border);
      font-size:14px;font-weight:800;
      padding:9px 14px;
      display:flex;align-items:center;justify-content:center;gap:10px;
      cursor:pointer;
    }
    .week-picker-button:hover{border-color:var(--accent)}
    .week-picker-button i{font-size:11px;transition:transform .15s}
    .week-picker.open .week-picker-button i{transform:rotate(180deg)}
    .week-picker-menu{
      position:absolute;top:100%;left:0;right:0;z-index:80;
      background:var(--card);border:1px solid var(--border);
      max-height:300px;overflow-y:auto;
      display:none;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
    }
    .week-picker.open .week-picker-menu{display:block}
    .week-picker-option{
      width:100%;min-height:44px;border:0;border-bottom:1px solid var(--border);
      background:var(--card);color:var(--foreground);
      padding:9px 14px;text-align:center;
      font-size:14px;font-weight:800;cursor:pointer;
    }
    .week-picker-option:hover{background:var(--muted)}
    .week-picker-option.selected{background:var(--accent);color:#000}
    @media(max-width:767px){
      .week-picker{min-width:145px}
      .week-picker-button{min-width:145px;min-height:40px;padding:7px 9px;font-size:12px}
      .week-picker-option{min-height:40px;padding:7px 9px;font-size:12px}
      .week-picker-menu{max-height:260px}
    }

    /* Responsive week selector */
    .week-controls{width:100%}
    .week-picker{min-width:0;max-width:220px;flex:1 1 175px}
    .week-picker-button{min-width:0;width:100%}
    @media(max-width:767px){
      .week-controls{
        display:grid;
        grid-template-columns:auto minmax(0,1fr) auto;
        gap:6px;
        width:100%;
        max-width:100%;
        align-items:center;
      }
      .week-picker{
        width:100%;
        min-width:0;
        max-width:none;
        flex:none;
      }
      .week-picker-button{
        width:100%;
        min-width:0;
        max-width:100%;
        min-height:40px;
        padding:7px 8px;
        font-size:12px;
        gap:6px;
      }
      #weekPickerLabel{
        display:block;
        min-width:0;
        overflow:hidden;
        white-space:nowrap;
        text-overflow:ellipsis;
      }
      .week-picker-menu{
        left:0;
        right:0;
        width:100%;
        min-width:100%;
        max-width:100%;
        max-height:52vh;
      }
      .week-picker-option{
        width:100%;
        min-height:40px;
        padding:8px 6px;
        font-size:12px;
      }
      .week-controls .gold-btn{
        min-width:0;
        min-height:40px;
        padding:7px 9px;
        gap:5px;
        font-size:11px;
        white-space:nowrap;
      }
    }
    @media(max-width:390px){
      .week-controls{gap:4px}
      .week-controls .gold-btn{
        padding:7px 7px;
        font-size:10px;
      }
      .week-picker-button{
        padding:7px 6px;
        font-size:11px;
      }
      .week-picker-button i{font-size:9px}
    }

    @media(min-width:901px){
      .page{
        max-width:1580px;
        padding:96px 28px 48px;
      }
      .layout{
        grid-template-columns:350px minmax(0,1fr);
        gap:48px;
        align-items:start;
      }
      .sidebar{
        position:sticky;
        top:96px;
      }
      .chart-nav{gap:10px}
      .chart-nav button{
        min-height:54px;
        font-size:16px;
        letter-spacing:.025em;
        background:#ececec;
        border-color:#d0d0d0;
      }
      .chart-nav button.active{
        background:var(--accent);
        border-color:var(--accent);
      }
      .main{min-width:0}
      .title-row{
        min-height:72px;
        margin:0 0 10px;
        align-items:flex-start;
      }
      h1{
        font-size:44px;
        line-height:.96;
        letter-spacing:-.035em;
      }
      .date-label{
        margin-top:8px;
        font-size:16px;
      }
      .week-nav{
        margin:8px 0 18px;
        gap:10px;
      }
      .week-label{font-size:12px}
      .week-controls{gap:14px}
      .gold-btn{
        min-height:54px;
        padding:0 20px;
        font-size:16px;
      }
      .week-picker{
        flex:0 0 190px;
        max-width:190px;
      }
      .week-picker-button{
        min-height:54px;
        font-size:15px;
        background:#eee;
      }
      .filters{
        gap:8px;
        margin-bottom:18px;
      }
      .filter{
        min-height:54px;
        min-width:50px;
        padding:0 14px;
        font-size:11px;
      }
      .chart-list{
        max-width:none;
        width:100%;
        gap:14px;
      }
      .chart-card{
        padding:0 18px;
        min-height:154px;
        display:flex;
        flex-direction:column;
        justify-content:center;
      }
      .desktop-row{
        grid-template-columns:74px 118px 44px minmax(0,1fr) auto;
        gap:14px;
        min-height:152px;
      }
      .rank-wrap{
        width:74px;
        height:100%;
      }
      .rank-num{
        min-width:74px;
        font-size:35px;
      }
      .cover{
        width:118px;
        height:118px;
      }
      .diff-wrap{
        width:44px;
        font-size:20px;
      }
      .diff-arrow{
        width:22px;
        height:22px;
      }
      .entry-title{
        font-size:19px;
        line-height:1.15;
      }
      .artist{
        font-size:17px;
        margin-top:4px;
      }
      .badge-inline{
        font-size:8px;
        vertical-align:middle;
      }
      .right{
        gap:18px;
      }
      .award{
        width:24px;
        height:24px;
        border:0;
        font-size:18px;
      }
      .award i{font-size:18px!important}
      .metrics{
        min-width:112px;
        display:grid;
        grid-template-columns:auto auto;
        column-gap:14px;
        row-gap:2px;
        font-size:12px;
        text-align:right;
      }
      .metrics .sep{display:none}
      .actions{
        gap:8px;
      }
      .action{
        width:40px;
        height:40px;
        font-size:14px;
      }

      /* Number one follows the larger reference card. */
      .chart-card:has(.rank-num.one){
        min-height:250px;
        padding-left:18px;
      }
      .chart-card:has(.rank-num.one) .desktop-row{
        min-height:248px;
        grid-template-columns:74px 214px 44px minmax(0,1fr) auto;
      }
      .chart-card:has(.rank-num.one) .rank-wrap{
        align-self:stretch;
        justify-content:center;
      }
      .rank-num.one{
        width:74px;
        height:78px;
        min-width:74px;
        font-size:42px;
      }
      .chart-card:has(.rank-num.one) .cover.one{
        width:214px;
        height:214px;
        margin-left:-14px;
        border-left:5px solid var(--accent);
      }
      .chart-card:has(.rank-num.one) .entry-title.one{
        font-size:24px;
      }
      .chart-card:has(.rank-num.one) .artist.one{
        font-size:18px;
      }
      .weeks1{
        font-size:9px;
        padding:3px 8px;

function parseCsvRow(line){
  const out=[];let cur='',quoted=false;
  for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){out.push(cur);cur=''}else cur+=ch}
  out.push(cur);return out;
}
function normalizeDate(v){
  if(!v)return'';v=String(v).trim();
  if(v.includes('/')){const p=v.split('/');if(p.length===3)return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')}
  return v;
}
function findIdx(h,names){const lower=h.map(x=>String(x).toLowerCase().trim());for(const n of names){const i=lower.indexOf(n.toLowerCase());if(i!==-1)return i}return -1}
function toInt(v){
  let x=String(v??'').trim();if(!x||x==='-')return 0;
  x=x.replace(/[^0-9.,\-]/g,'');if(!x)return 0;
  if(x.includes('.')&&((x.match(/\./g)||[]).length>1||/^\d+\.\d{3}$/.test(x)))x=x.replace(/\./g,'');
  x=x.replace(/,/g,'');const n=parseInt(x,10);return Number.isFinite(n)?n:0;
}
function val(r,i){return i>=0?(r[i]||'').trim():''}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}catch{return d}}
function fmtShort(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}catch{return d}}
function itemKey(e){return (e.name||'').toLowerCase()+'|'+(e.artist||'').toLowerCase()}
function computeChartPoints(position,chartId){const n=['songs','streamingSongs','radioSongs','digitalSongsSales'].includes(chartId)?100:50;return Math.round(1000*Math.pow(Math.max(0,(n-position+1))/n,1.5))}
function formatValue(v,chartId,isStream=false){
  const num=toInt(v);if(!num)return String(v??'-')||'-';
  if((isStream||['radioSongs','topStreamingAlbums','streamingSongs'].includes(chartId))){
    if(num>=1000000)return (num/1000000).toFixed(1).replace(/\.0$/,'')+'B';
    if(num>=1000)return Math.round(num/1000)+'M';
  }
  return num.toLocaleString('en-US');
}
function certification(units,type){
  if(type==='song'){if(units>=12000000)return'2x Diamond';if(units>=6000000)return'Diamond';if(units>=600000){const x=Math.floor(units/600000);return x>=2?x+'x Platinum':'Platinum'}if(units>=400000)return'Gold';if(units>=200000)return'Silver'}
  else{if(units>=20000000)return'2x Diamond';if(units>=10000000)return'Diamond';if(units>=1000000){const x=Math.floor(units/1000000);return x>=2?x+'x Platinum':'Platinum'}if(units>=500000)return'Gold'}
  return'';
}
async function fetchText(url,retries=3){
  const cached=sessionStorage.getItem('csv:'+url);
  const ts=Number(sessionStorage.getItem('csvts:'+url)||0);
  if(cached&&Date.now()-ts<10*60*1000)return cached;
  let last;
  for(let attempt=0;attempt<=retries;attempt++){
    try{
      const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),30000);
      const res=await fetch(url,{cache:'default',signal:ctrl.signal});clearTimeout(timer);
      if(res.status===429&&attempt<retries){await new Promise(r=>setTimeout(r,1000*(attempt+1)));continue}
      if(!res.ok)throw new Error('CSV '+res.status);
      let text=await res.text();if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      try{sessionStorage.setItem('csv:'+url,text);sessionStorage.setItem('csvts:'+url,String(Date.now()))}catch{}
      return text;
    }catch(e){last=e;if(attempt<retries)await new Promise(r=>setTimeout(r,1000*(attempt+1)))}
  }
  throw last||new Error('CSV failed');
}
async function fetchRows(url){const text=await fetchText(url);return text.trim().split(/\r?\n/).filter(Boolean).map(parseCsvRow)}

const ALBUM_OVERRIDES={anitta:{'versions of me':'Girl from Rio'},waneesa:{'w (2005)':'W','w':'W'}};
function parseSheet(rows,cfg){
  if(!rows.length)return{};
  const h=rows[0].map(x=>String(x).toLowerCase().trim());
  const idx={
    date:findIdx(h,['date','chart date']),position:findIdx(h,['position','rank','pos']),diff:findIdx(h,['dif','diff','▲▼']),
    song:findIdx(h,['song','title','track']),album:findIdx(h,['album']),artist:findIdx(h,['artist','artists']),
    lastWeek:findIdx(h,['last week','lw','last wk','prev week','previous week']),peak:findIdx(h,['peak']),weeks:findIdx(h,['weeks','wks']),
    weeksAt1:findIdx(h,['weeks at 1','wks at 1','week at #1','week at 1','weeks at #1']),points:findIdx(h,['points']),
    sales:findIdx(h,['sales','sales/streams','sales/streaming','pure sales']),streams:findIdx(h,['streams','sea','streaming']),
    airplay:findIdx(h,['airplay']),audience:findIdx(h,['audience']),certification:findIdx(h,['certification']),
    units:findIdx(h,['units','spins','sales','streams','audience']),totalUnits:findIdx(h,['total units','total']),
    totalStreams:findIdx(h,['total streams','total streaming']),totalSales:findIdx(h,['total sales'])
  };
  if(cfg.id==='radioSongs'){const a=h.indexOf('audience');if(a!==-1)idx.units=a}
  const nameIdx=cfg.kind==='artist'?idx.artist:cfg.kind==='album'?idx.album:idx.song;
  const out={};
  for(const r of rows.slice(1)){
    const date=normalizeDate(r[idx.date]);if(!date)continue;
    const rawName=val(r,nameIdx),rawArtist=val(r,idx.artist);
    const finalName=(ALBUM_OVERRIDES[rawArtist.toLowerCase()]||{})[rawName.toLowerCase()]||rawName;
    const e={
      position:toInt(r[idx.position]),diff:idx.diff>=0?val(r,idx.diff):'',name:finalName,artist:rawArtist,
      album:idx.album>=0?val(r,idx.album):'',peak:toInt(r[idx.peak]),weeks:toInt(r[idx.weeks]),weeksAt1:idx.weeksAt1>=0?toInt(r[idx.weeksAt1]):0,
      lastWeek:idx.lastWeek>=0?val(r,idx.lastWeek):'',points:idx.points>=0?val(r,idx.points):'',sales:idx.sales>=0?val(r,idx.sales):'',
      streams:idx.streams>=0?val(r,idx.streams):'',airplay:idx.airplay>=0?val(r,idx.airplay):'',audience:idx.audience>=0?val(r,idx.audience):'',
      certification:idx.certification>=0?val(r,idx.certification):'',units:idx.units>=0?val(r,idx.units):'',totalUnits:idx.totalUnits>=0?val(r,idx.totalUnits):'',
      totalStreams:idx.totalStreams>=0?val(r,idx.totalStreams):'',totalSales:idx.totalSales>=0?val(r,idx.totalSales):''
    };
    if(!e.name||!e.position)continue;(out[date]??=[]).push(e);
  }
  return out;
}
function computeDiffs(dates,entriesByDate){
  const seen=new Map();
  for(let di=0;di<dates.length;di++){
    const d=dates[di],prev=dates[di-1],prevMap=new Map();
    if(prev)for(const e of entriesByDate[prev]||[])prevMap.set(itemKey(e),e.position);
    for(const e of entriesByDate[d]||[]){
      const key=itemKey(e),p=prevMap.get(key);
      if(p==null)e.diff=seen.has(key)?'RE':'NEW';
      else{const move=p-e.position;e.diff=move>0?'▲'+move:move<0?'▼'+Math.abs(move):'='}
      if(!seen.has(key))seen.set(key,d);
    }
  }
}
async function loadSecondaryFromSupabase(chartId){
  const cacheKey='supabase:'+chartId;
  try{
    const cached=sessionStorage.getItem(cacheKey);
    const ts=Number(sessionStorage.getItem(cacheKey+':ts')||0);
    if(cached&&Date.now()-ts<10*60*1000)return JSON.parse(cached);
  }catch{}

  const url=SUPABASE_URL+'/rest/v1/chart_data?select=chart_id,data&chart_type=eq.secondary&chart_id=like.'+encodeURIComponent(chartId+'_*')+'&order=chart_id.asc';
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),30000);
  try{
    const res=await fetch(url,{
      headers:{apikey:SUPABASE_KEY,Accept:'application/json'},
      signal:ctrl.signal
    });
    if(!res.ok)throw new Error('Supabase '+res.status);
    const rows=await res.json();
    const merged={};
    for(const row of rows||[]){
      const byDate=row?.data?.entriesByDate||{};
      for(const [d,list] of Object.entries(byDate)){
        if(!Array.isArray(list))continue;
        (merged[d]??=[]).push(...list.map(e=>({...e})));
      }
    }
    try{
      sessionStorage.setItem(cacheKey,JSON.stringify(merged));
      sessionStorage.setItem(cacheKey+':ts',String(Date.now()));
    }catch{}
    return merged;
  }finally{
    clearTimeout(timer);
  }
}

async function loadWeekly(chartId){
  if(state.cache.has(chartId))return state.cache.get(chartId);
  const cfg=charts[chartId];
  const primaryPromise=fetchRows(cfg.url);
  const secondaryPromise=cfg.secondaryUrl
    ? loadSecondaryFromSupabase(chartId).catch(async()=>{
        const rows=await fetchRows(cfg.secondaryUrl).catch(()=>null);
        return rows?parseSheet(rows,cfg):null;
      })
    : Promise.resolve(null);
  const [primaryRows,secondaryEntries]=await Promise.all([primaryPromise,secondaryPromise]);
  const entriesByDate=parseSheet(primaryRows,cfg);
  if(secondaryEntries){
    for(const [d,list] of Object.entries(secondaryEntries)){
      if(!Array.isArray(list))continue;
      (entriesByDate[d]??=[]).push(...list.map(e=>({...e})));
    }
  }
  const dates=Object.keys(entriesByDate).sort();
  for(const d of dates){
    entriesByDate[d].sort((a,b)=>a.position-b.position);
    const byKey=new Map(),dedup=[];
    for(const e of entriesByDate[d]){
      const k=itemKey(e),existing=byKey.get(k);
      if(!existing){byKey.set(k,e);dedup.push(e)}
      else if(e.position<existing.position){const ix=dedup.indexOf(existing);if(ix>=0)dedup[ix]=e;byKey.set(k,e)}
    }
    entriesByDate[d]=dedup.sort((a,b)=>a.position-b.position);
  }
  if(cfg.secondaryUrl){
    const running=new Map(),prevPos=new Map();
    for(const d of dates){
      for(const e of entriesByDate[d]){
        e.position=toInt(e.position);e.peak=toInt(e.peak);e.weeks=toInt(e.weeks);e.weeksAt1=toInt(e.weeksAt1);
        e.name=String(e.name||'').trim();e.artist=String(e.artist||'').trim();
        const k=itemKey(e),st=running.get(k)||{weeks:0,peak:Infinity,weeksAt1:0};
        st.weeks++;st.peak=Math.min(st.peak,e.position);if(e.position===1)st.weeksAt1++;
        e.lastWeek=prevPos.has(k)?String(prevPos.get(k)):'';
        e.weeks=st.weeks;e.peak=st.peak;e.weeksAt1=st.weeksAt1||0;
        if(chartId==='songs'&&!e.points)e.points=String(computeChartPoints(e.position,'songs'));
        else if(chartId!=='songs'&&!e.units)e.units=String(computeChartPoints(e.position,chartId));
        running.set(k,st);
      }
      prevPos.clear();for(const e of entriesByDate[d])prevPos.set(itemKey(e),e.position);
    }
  }
  computeDiffs(dates,entriesByDate);
  const data={chartId,title:cfg.title,kind:cfg.kind,dates,entriesByDate};
  state.cache.set(chartId,data);return data;
}

function diffType(diff){const d=String(diff||'');if(d==='NEW')return'debut';if(d==='RE')return're';if(d.startsWith('▲'))return'rising';if(d.startsWith('▼'))return'falling';return'static'}
function diffHtml(diff){
  const d=String(diff||'');
  if(d==='NEW')return '<span class="diff-badge diff-new">NEW</span>';
  if(d==='RE')return '<span class="diff-badge diff-new">RE-ENTRY</span>';
  if(d.startsWith('▲'))return '<svg class="diff-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M4 7l4-4 4 4"/></svg>';
  if(d.startsWith('▼'))return '<svg class="diff-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 13V3M4 9l4 4 4-4"/></svg>';
  return '<svg class="diff-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
}
function colorClass(diff){
  if(!state.diffColors)return'';const d=String(diff||'');
  if(d==='NEW')return'color-new';if(d==='RE')return'color-re';
  if(d.startsWith('▲'))return toInt(d.slice(1))>=10?'color-up10':'color-up1';

  return'';

function awardsFor(e,entries,chartId){
  const eligible=(chartId==='songs'||chartId==='albums')&&(e.diff==='NEW'||e.diff==='RE'||String(e.diff).startsWith('▲'));
  if(!eligible)return{hasStar:false,gainer:false};
  let maxStreams=0,streamKey='',maxSales=0,salesKey='';
  for(const x of entries){
    const st=toInt(x.streams);if(st>maxStreams){maxStreams=st;streamKey=itemKey(x)}
    const sa=toInt(x.sales);if(sa>maxSales){maxSales=sa;salesKey=itemKey(x)}
  }
  const k=itemKey(e),g=(maxStreams>0&&streamKey===k)||(maxSales>0&&salesKey===k);
  return{hasStar:true,gainer:g};
}
function detailFields(e,cfg){
  const out=[];
  if(cfg.id==='artists'){
    out.push(['Units',formatValue(e.units,cfg.id)],['Total Units',formatValue(e.totalUnits,cfg.id)],['Sales',formatValue(e.sales,cfg.id)],['Total Sales',formatValue(e.totalSales,cfg.id)],['Streams',formatValue(e.streams,cfg.id,true)],['Total Streams',formatValue(e.totalStreams,cfg.id,true)]);
  }else if(cfg.id==='songs'){
    if(e.points)out.push(['Points',formatValue(e.points,cfg.id)]);
    out.push(['Streams',formatValue(e.streams,cfg.id,true)]);
    if(e.airplay)out.push(['Airplay',formatValue(e.airplay,cfg.id,true)]);
    out.push(['Sales',formatValue(e.sales,cfg.id)],['Units',formatValue(e.units,cfg.id)]);
    if(e.totalUnits)out.push(['Total Units',formatValue(e.totalUnits,cfg.id)]);
  }else if(cfg.id==='albums'){
    out.push(['Units',formatValue(e.units,cfg.id)]);
    if(e.totalUnits)out.push(['Total Units',formatValue(e.totalUnits,cfg.id)]);
    out.push(['Pure Sales',formatValue(e.sales,cfg.id)],['SEA',formatValue(e.streams,cfg.id,true)]);
  }else if(cfg.id==='radioSongs'){
    out.push(['Audience',formatValue(e.audience||e.units,cfg.id,true)]);
  }else if(cfg.id==='topStreamingAlbums'||cfg.id==='streamingSongs'){
    out.push(['Streams',formatValue(e.streams||e.units,cfg.id,true)]);
    if(e.totalStreams)out.push(['Total Streams',formatValue(e.totalStreams,cfg.id,true)]);
  }else if(cfg.id==='topAlbumSales'||cfg.id==='digitalSongsSales'){
    out.push(['Sales',formatValue(e.sales||e.units,cfg.id)]);
    if(e.totalSales)out.push(['Total Sales',formatValue(e.totalSales,cfg.id)]);
  }
  const cert=e.certification||((cfg.id==='songs'||cfg.id==='albums')?certification(toInt(e.totalUnits),cfg.kind):'');
  if(cert)out.push(['Certification',cert]);
  return out.filter(x=>x[1]&&x[1]!=='-'&&x[1]!=='0');
}
function runEntries(e,data,date){
  const k=itemKey(e),arr=[];
  for(const d of data.dates){if(d>date)break;for(const x of data.entriesByDate[d]||[])if(itemKey(x)===k)arr.push({date:d,...x})}
  return arr;
}
function wordOrdinal(n){
  const w=['zeroth','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','eleventh','twelfth','thirteenth','fourteenth','fifteenth','sixteenth','seventeenth','eighteenth','nineteenth','twentieth'];
  return n>=0&&n<=20?w[n]:n+'th';
}
function copyText(e,cfg,date,data){
  let copyDiff=e.diff;if(copyDiff==='NEW')copyDiff='new';else if(copyDiff==='RE')copyDiff='re';else if(String(copyDiff).startsWith('▲'))copyDiff='+'+copyDiff.slice(1);else if(String(copyDiff).startsWith('▼'))copyDiff='-'+copyDiff.slice(1);
  const isNew=e.diff==='NEW',isUp=String(e.diff).startsWith('▲'),isRe=e.diff==='RE',atPeak=e.position===e.peak,w1=e.weeksAt1||0;
  const pos=isNew?'#'+e.position+'(new)':'#'+e.position+'('+copyDiff+')';
  let detail='';
  if(cfg.kind==='album'&&isNew){
    const units=toInt(e.units),streams=toInt(e.streams),sales=toInt(e.sales),parts=[];
    if(streams)parts.push((streams/1000).toLocaleString('en-US')+' million on-demand streams');
    if(sales)parts.push(sales.toLocaleString('en-US')+' pure sales');
    detail=(units?units.toLocaleString('en-US'):'')+(parts.length?' ['+parts.join(' | ')+'].':'.');
  }else if(cfg.kind==='album'&&e.units){
    detail=formatValue(e.units,cfg.id)+(e.totalUnits?' ('+formatValue(e.totalUnits,cfg.id)+' units since release)':'');
  }
  const run=runEntries(e,data,date),weeksAtPeak=run.filter(x=>x.position===e.peak).length;
  let annotation='';
  if(atPeak&&isUp&&!isNew&&e.position===1&&w1>1)annotation='*re-peak; '+wordOrdinal(w1)+' week at #1*';
  else if(e.position===1&&w1>1)annotation='*'+wordOrdinal(w1)+' week at #1*';
  else if(atPeak&&(isUp||isRe)&&!isNew)annotation='*new peak*';
  else if(e.peak===1&&w1>=1)annotation=w1>1?'*peak: #1 for '+w1+' weeks*':'*peak: #1*';
  else if(e.peak>0&&weeksAtPeak>1)annotation='*peak: #'+e.peak+' for '+weeksAtPeak+' weeks*';
  else annotation='*peak: #'+e.peak+'*';
  const weeksPart=isNew?'':'['+e.weeks+' weeks].';
  return ['Daegon\'s '+cfg.title+':',pos,e.name+',',e.artist,detail,weeksPart,isNew?'':annotation].filter(Boolean).join(' ')+'\n\nChart dated '+fmtDate(date)+'.';
}

function comparable(value){
  return String(value||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/&/g,'and')
    .replace(/[’‘]/g,"'")
    .replace(/[^a-z0-9' ]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

async function resolveImage(e,cfg){
  const key=cfg.kind+'|'+artworkIdentityTitle(cfg.kind,e.name)+'|'+comparable(e.artist||e.name);
  if(state.images.has(key))return state.images.get(key);

  const persistedKey='img:'+key;
  try{
    const persisted=localStorage.getItem(persistedKey);
    if(persisted&&/^https?:\/\//i.test(persisted)){
      state.images.set(key,persisted);
      return persisted;
    }
  }catch{}

  const name=String(e.name||'').trim();
  const artist=String(e.artist||e.name||'').trim();

  let url='';
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),20000);
    const r=await fetch(SUPABASE_URL+'/functions/v1/artwork-resolver',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPABASE_ANON_JWT,
        'Authorization':'Bearer '+SUPABASE_ANON_JWT
      },
      body:JSON.stringify({kind:cfg.kind,name,artist}),
      signal:ctrl.signal
    });
    clearTimeout(timer);
    if(r.ok){
      const d=await r.json();
      if(usableImage(d?.imageUrl))url=d.imageUrl;
    }
  }catch{}

  const isReal=usableImage(url)&&/^https?:\/\//i.test(url);
  if(!isReal)url='';

  if(isReal){
    state.images.set(key,url);
    try{localStorage.setItem(persistedKey,url)}catch{}
  }else{
    state.images.delete(key);
    try{localStorage.removeItem(persistedKey)}catch{}
  }
  return url;
}
async function resolvePreview(e){
  const key=e.name+'|'+e.artist;if(state.previews.has(key))return state.previews.get(key);
  let p='';try{const d=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(e.name+' '+e.artist)+'&entity=song&limit=5').then(r=>r.ok?r.json():null);const hit=(d?.results||[]).find(x=>String(x.trackName||'').toLowerCase()===e.name.toLowerCase())||(d?.results||[])[0];p=hit?.previewUrl||''}catch{}
  state.previews.set(key,p);return p;
}
async function hydrateImages(cfg,rows){
  const nodes=[...content.querySelectorAll('[data-image-key]')];
  const byKey=new Map();

  for(const node of nodes){
    const key=node.dataset.imageKey;
    if(!key)continue;
    if(!byKey.has(key))byKey.set(key,[]);
    byKey.get(key).push(node);
  }

  const entries=[...byKey.keys()]
    .map(key=>rows.find(x=>itemKey(x)===key))
    .filter(Boolean);

  const concurrency=6;
  let cursor=0;

  async function worker(){
    while(cursor<entries.length){
      const e=entries[cursor++];
      const key=itemKey(e);
      const url=await resolveImage(e,cfg);
      if(!url)continue;

      for(const node of byKey.get(key)||[]){
        if(node.isConnected){
          node.innerHTML='<img src="'+esc(url)+'" loading="lazy" decoding="async" onerror="this.onerror=null;this.remove();">';
        }
      }
    }
  }

  await Promise.all(Array.from({length:Math.min(concurrency,entries.length)},()=>worker()));
}

      const selected=weekPickerMenu.querySelector('.selected');
      if(selected) selected.scrollIntoView({block:'center'});
    });
  }
});

weekPickerButton.addEventListener('touchend',function(e){
  lastWeekPickerTouch=Date.now();
  e.preventDefault();
  e.stopPropagation();
  const open=weekPicker.classList.toggle('open');
  if(open){
    requestAnimationFrame(()=>{
      const selected=weekPickerMenu.querySelector('.selected');
      if(selected) selected.scrollIntoView({block:'center'});
    });
  }
},{passive:false});

document.addEventListener('click',function(e){
  if(!weekPicker.contains(e.target)) weekPicker.classList.remove('open');
});

renderNav();loadChart('songs');
</script>
</body>
</html>
