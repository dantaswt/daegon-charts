<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daegon charts — weekly music charts</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/jaBZ19n.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    (function(){
      try{
        var t=localStorage.getItem('theme');
        if(t!=='light') document.documentElement.classList.add('dark');
      }catch(e){}
    })();
  </script>
  <style>
    :root{
      --background:#e8e8e8;
      --foreground:#1a1a1a;
      --card:#ffffff;
      --card-foreground:#1a1a1a;
      --muted:#f0f0f0;
      --muted-foreground:#6b7280;
      --accent:#FF6D00;
      --border:#d4d4d4;
      --border-dark:#c0c0c0;
    }
    html.dark{
      --background:#1a1a1a;
      --foreground:#f5f5f5;
      --card:#0f0f0f;
      --card-foreground:#f5f5f5;
      --muted:#171717;
      --muted-foreground:#9CA3AF;
      --border:#2a2a2a;
      --border-dark:#333333;
    }
    *{box-sizing:border-box;border-radius:0!important}
    html,body{margin:0;background:var(--background);color:var(--foreground);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    body{min-height:100vh}
    button,select{font:inherit}
    button{cursor:pointer}
    .shell{min-height:100vh;display:flex;flex-direction:column}
    .site-header{
      position:fixed;top:0;left:0;right:0;z-index:100;
      background:linear-gradient(to bottom,#0f0f0f,#161616);
      border-bottom:1px solid #2a2a2a;
    }
    .header-inner{
      max-width:1280px;margin:0 auto;padding:12px 16px;
      display:flex;align-items:center;justify-content:space-between;gap:16px;
    }
    .brand{font-size:20px;font-weight:800;color:#f5f5f5;letter-spacing:.02em;text-transform:lowercase}
    .weekly-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#9ca3af}
    .theme-btn{
      width:44px;height:44px;border:1px solid var(--border);background:var(--card);color:var(--foreground);
      display:flex;align-items:center;justify-content:center;transition:.15s;
    }
    .theme-btn:hover{border-color:var(--accent);color:var(--accent)}
    .page{
      flex:1;max-width:1280px;width:100%;margin:0 auto;padding:88px 12px 36px;
    }
    .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px}
    .sidebar{position:sticky;top:96px;align-self:start}
    .chart-nav{display:flex;flex-direction:column;gap:8px}
    .chart-nav button{
      min-height:44px;border:1px solid var(--border);background:var(--muted);color:var(--foreground);
      font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:9px 14px;
      transition:.15s;
    }
    .chart-nav button:hover,.chart-nav button.active{background:var(--accent);color:#000;border-color:var(--accent)}
    .main{min-width:0}
    .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
    h1{margin:0;font-size:36px;line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
    .date-label{margin-top:6px;font-size:13px;color:var(--muted-foreground)}
    .week-nav{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 16px}
    .week-label{font-size:12px;color:var(--muted-foreground);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    .week-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
    .gold-btn{
      min-height:44px;border:0;background:var(--accent);color:#000;font-weight:700;padding:9px 14px;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
    }
    .gold-btn:disabled{opacity:.4;cursor:not-allowed}
    .date-select{
      min-height:44px;border:1px solid var(--border);background:var(--muted);color:var(--foreground);
      font-size:14px;font-weight:800;padding:9px 14px;min-width:175px;text-align:center;
    }
    .filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
    .filter{
      min-height:44px;border:1px solid var(--border);background:var(--muted);color:var(--foreground);
      padding:9px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    }
    .filter.active{background:var(--accent);color:#000;border-color:var(--accent)}
    .chart-list{display:flex;flex-direction:column;gap:12px;max-width:896px;margin:0 auto}
    .chart-card{
      background:var(--card);color:var(--card-foreground);border:1px solid var(--border);
      padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
      transition:transform .18s ease,box-shadow .18s ease;
    }
    .chart-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
    .desktop-row{
      display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;gap:12px;align-items:center;
    }
    .rank-wrap{width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .rank-num{font-size:30px;font-weight:900;min-width:64px;display:flex;align-items:center;justify-content:center}
    .rank-num.one{font-size:36px;width:64px;height:64px;background:var(--accent);color:#000}
    .weeks1{margin-top:3px;padding:2px 6px;background:#FFD600;color:#000;font-size:9px;font-weight:800;text-transform:uppercase;white-space:nowrap}
    .cover{
      width:96px;height:96px;background:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--muted-foreground)
    }
    .cover.one{width:180px;height:180px;border-left:4px solid var(--accent);margin-left:-12px}
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .diff-wrap{width:32px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)}
    .diff-arrow{width:19px;height:19px}
    .diff-badge{font-size:10px;font-weight:800;line-height:1;letter-spacing:.05em}
    .diff-new{background:#00E676;color:#000;padding:3px 5px}
    .entry{min-width:0}
    .entry-title{font-weight:800;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
    .entry-title.one{font-size:20px}
    .artist{margin-top:3px;color:var(--muted-foreground);font-size:14px;line-height:1.25}
    .artist.one{font-size:16px}
    .badge-inline{display:inline-flex;margin-left:6px;padding:2px 5px;background:#FFD600;color:#000;font-size:9px;font-weight:800;text-transform:uppercase;white-space:nowrap}
    .right{display:flex;align-items:center;gap:16px}
    .award{width:24px;height:24px;border:2px solid currentColor;border-radius:9999px!important;display:flex;align-items:center;justify-content:center}
    .metrics{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted-foreground);white-space:nowrap}
    .metrics .sep{color:var(--border)}
    .actions{display:flex;flex-direction:column;gap:8px}
    .action{
      width:32px;height:32px;border:0;background:var(--muted);color:var(--foreground);
      display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:9999px!important;transition:.15s
    }
    .action:hover{background:var(--border)}
    .details{
      margin-top:12px;border:1px solid var(--border);background:var(--muted);padding:12px;
      font-size:13px;color:var(--foreground)
    }
    .details-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
    .detail-box{background:var(--card);border:1px solid var(--border);padding:9px}
    .detail-k{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground)}
    .detail-v{font-size:13px;font-weight:700;margin-top:3px}
    .dropouts{max-width:896px;margin:28px auto 0;border:1px solid var(--border);background:var(--muted);padding:16px}
    .dropouts-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.2em;color:var(--muted-foreground);margin-bottom:10px}
    .dropout{display:flex;gap:10px;align-items:center;border:1px solid var(--border-dark);background:var(--card);padding:10px;margin-top:8px}
    .dropout-rank{font-weight:800}
    .dropout-info{min-width:0}
    .dropout-name{font-size:13px;font-weight:700}
    .dropout-meta{font-size:10px;color:var(--muted-foreground);margin-top:2px}
    .mobile-row{display:none}
    .back-top{
      position:fixed;right:18px;bottom:20px;z-index:120;width:48px;height:48px;border:0;background:var(--accent);color:#000;
      border-radius:9999px!important;display:none;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.2)
    }
    .loader-wrap{display:flex;justify-content:center;padding:60px 0}
    .loader{width:42px;height:42px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:9999px!important;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{text-align:center;padding:48px 10px;color:var(--muted-foreground)}
    .color-new{background:#bae6fd!important;color:#1a1a1a!important}
    .color-re{background:#93c5fd!important;color:#1a1a1a!important}
    .color-up1{background:#d1fae5!important;color:#1a1a1a!important}
    .color-up10{background:#6ee7b7!important;color:#1a1a1a!important}
    .color-down1{background:#fee2e2!important;color:#1a1a1a!important}
    .color-down10{background:#fca5a5!important;color:#1a1a1a!important}
    .site-footer{margin-top:auto;background:#0f0f0f;border-top:1px solid #2a2a2a;padding:28px 16px;text-align:center;color:#9ca3af;font-size:12px}
    @media(max-width:900px){
      .layout{grid-template-columns:1fr}
      .sidebar{position:static}
      .chart-nav{display:flex;flex-direction:row;overflow-x:auto;gap:0;margin-bottom:6px}
      .chart-nav button{flex:0 0 auto;white-space:nowrap}
    }
    @media(max-width:767px){
      .page{padding-top:80px}
      .header-inner{padding:9px 14px}
      .brand{position:absolute;left:64px;right:64px;text-align:center;font-size:18px}
      .weekly-label{visibility:hidden}
      .title-row{justify-content:center;text-align:center}
      h1{font-size:28px}
      .desktop-row{display:none}
      .mobile-row{display:flex;align-items:flex-start;gap:8px}
      .chart-card{padding:13px 14px}
      .m-rank{width:32px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:2px}
      .m-rank-num{font-size:20px;font-weight:900;line-height:1}
      .m-diff{height:20px;margin-top:3px;display:flex;align-items:center;justify-content:center}
      .m-cover{width:64px;height:64px;background:var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted-foreground)}
      .m-cover.one{width:68px;height:68px;border-left:3px solid var(--accent)}
      .m-cover img{width:100%;height:100%;object-fit:cover}
      .m-entry{min-width:0;flex:1}
      .m-title{font-size:13px;font-weight:800;line-height:1.15;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
      .m-artist{font-size:11px;color:var(--muted-foreground);line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .m-metrics{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--muted-foreground);white-space:nowrap;margin-top:4px}
      .m-actions{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
      .m-actions-top{display:flex;align-items:center;gap:6px}
      .week-nav{margin-top:4px}
      .filters{gap:6px}
      .filter{padding:8px 10px}
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="site-header">
    <div class="header-inner">
      <div class="weekly-label">WEEKLY CHARTS</div>
      <div class="brand">daegon charts</div>
      <button id="themeToggle" class="theme-btn" aria-label="Toggle theme"><i class="fas fa-sun"></i></button>
    </div>
  </header>

  <div class="page">
    <div class="layout">
      <aside class="sidebar"><div id="chartNav" class="chart-nav"></div></aside>
      <main class="main">
        <div class="title-row">
          <div>
            <h1 id="chartTitle"></h1>
            <div id="dateLabel" class="date-label"></div>
          </div>
        </div>

        <div class="week-nav">
          <div class="week-label">Chart Week</div>
          <div class="week-controls">
            <button id="prevBtn" class="gold-btn"><i class="fas fa-chevron-left"></i> Prev</button>
            <select id="weekSelect" class="date-select"></select>
            <button id="nextBtn" class="gold-btn">Next <i class="fas fa-chevron-right"></i></button>
          </div>
        </div>

        <div id="filters" class="filters">
          <button class="filter active" data-filter="all">ALL</button>
          <button class="filter" data-filter="debut">NEW</button>
          <button class="filter" data-filter="re">RE</button>
          <button class="filter" data-filter="rising"><i class="fas fa-arrow-up"></i></button>
          <button class="filter" data-filter="falling"><i class="fas fa-arrow-down"></i></button>
          <button class="filter" data-filter="static"><i class="fas fa-arrow-right"></i></button>
          <button id="colorToggle" class="filter" title="Color movements"><i class="fas fa-palette"></i></button>
        </div>

        <div id="content" class="chart-list"><div class="loader-wrap"><div class="loader"></div></div></div>
        <div id="dropouts"></div>

        <div class="week-nav" style="margin-top:28px">
          <div class="week-controls">
            <button id="prevBtnBottom" class="gold-btn"><i class="fas fa-chevron-left"></i> Prev</button>
            <button id="nextBtnBottom" class="gold-btn">Next <i class="fas fa-chevron-right"></i></button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <footer class="site-footer">Chart generated based on daegon charts archive.</footer>
  <button id="backTop" class="back-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
</div>

<script>
const SHEET='https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/export?format=csv&gid=';
const charts={
  songs:{title:'Hot 100',gid:'904867620',kind:'song'},
  artists:{title:'Top 50 Artists',gid:'1568177610',kind:'artist'},
  albums:{title:'Top 100 Albums',gid:'1940039611',kind:'album'},
  radioSongs:{title:'Radio Songs',gid:'1681272096',kind:'song'},
  topStreamingAlbums:{title:'Top Streaming Albums',gid:'1028545573',kind:'album'},
  topAlbumSales:{title:'Top Album Sales',gid:'1111633725',kind:'album'},
  streamingSongs:{title:'Streaming Songs',gid:'626144821',kind:'song'},
  digitalSongsSales:{title:'Digital Songs Sales',gid:'302176914',kind:'song'}
};
const weeklyIds=Object.keys(charts);
const state={active:'songs',cache:new Map(),filters:new Set(['all']),diffColors:false,date:null,details:new Set()};
const chartNav=document.getElementById('chartNav'), content=document.getElementById('content'), dropoutsEl=document.getElementById('dropouts');
const chartTitle=document.getElementById('chartTitle'), dateLabel=document.getElementById('dateLabel'), weekSelect=document.getElementById('weekSelect');

function parseCsvRow(line){
  const out=[];let cur='',quoted=false;
  for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){out.push(cur);cur=''}else cur+=ch}
  out.push(cur);return out;
}
function normalizeDate(v){
  if(!v)return'';v=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
  const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:v;
}
function findIndex(h,names){for(const n of names){const i=h.indexOf(n);if(i!==-1)return i}return -1}
function val(r,i){return i>=0?(r[i]||'').trim():''}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}catch{return d}}
function fmtShort(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}catch{return d}}
function parseNum(v){const n=parseInt(String(v??'').replace(/[^0-9-]/g,''),10);return Number.isFinite(n)?n:0}

async function fetchChart(id){
  if(state.cache.has(id))return state.cache.get(id);
  const res=await Promise.race([fetch(SHEET+charts[id].gid+'&_='+Date.now()),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))]);
  if(!res.ok)throw new Error('HTTP '+res.status);
  let csv=await res.text();if(csv.charCodeAt(0)===0xFEFF)csv=csv.slice(1);
  const rows=csv.trim().split(/\r?\n/).map(parseCsvRow);
  const h=rows[0].map(x=>x.toLowerCase().trim());
  const idx={
    date:findIndex(h,['date','chart date']),position:findIndex(h,['position','rank','pos']),diff:findIndex(h,['dif','diff','▲▼']),
    song:findIndex(h,['song','title','track']),album:findIndex(h,['album']),artist:findIndex(h,['artist','artists']),
    lw:findIndex(h,['last week','lw']),peak:findIndex(h,['peak']),weeks:findIndex(h,['weeks','wks']),weeksAt1:findIndex(h,['weeks at 1','wks at 1','weeks at #1']),
    units:findIndex(h,['units']),totalUnits:findIndex(h,['total units','total']),sales:findIndex(h,['sales']),streams:findIndex(h,['streams']),airplay:findIndex(h,['airplay','audience']),
    cover:findIndex(h,['cover','image','image url','cover url','artwork','artwork url'])
  };
  const byDate={};
  for(const r of rows.slice(1)){const d=normalizeDate(r[idx.date]||'');if(!d)continue;(byDate[d]??=[]).push(r)}
  Object.values(byDate).forEach(list=>list.sort((a,b)=>(parseInt(a[idx.position])||999)-(parseInt(b[idx.position])||999)));
  const data={idx,byDate,dates:Object.keys(byDate).sort((a,b)=>new Date(a)-new Date(b))};
  state.cache.set(id,data);return data;
}

function visibleCharts(date){
  return date&&date<'2017-01-01'?['songs','artists','albums']:weeklyIds;
}
function renderNav(){
  chartNav.innerHTML=visibleCharts(state.date).map(id=>`<button data-id="${id}" class="${id===state.active?'active':''}">${charts[id].title}</button>`).join('');
  chartNav.querySelectorAll('button').forEach(b=>b.onclick=()=>loadChart(b.dataset.id,state.date));
}
function diffType(diff){
  const d=String(diff||'');
  if(d==='NEW')return'debut';if(d==='RE')return're';if(d.startsWith('▲'))return'rising';if(d.startsWith('▼'))return'falling';return'static';
}
function diffHtml(diff){
  const d=String(diff||'');
  if(d==='NEW')return '<span class="diff-badge diff-new">NEW</span>';
  if(d==='RE')return '<span class="diff-badge diff-new">RE-ENTRY</span>';
  if(d.startsWith('▲'))return '<svg class="diff-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M4 7l4-4 4 4"/></svg>';
  if(d.startsWith('▼'))return '<svg class="diff-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 13V3M4 9l4 4 4-4"/></svg>';
  return '<svg class="diff-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
}
function colorClass(diff){
  if(!state.diffColors)return'';
  const d=String(diff||'');
  if(d==='NEW')return'color-new';if(d==='RE')return'color-re';
  if(d.startsWith('▲'))return parseNum(d.slice(1))>=10?'color-up10':'color-up1';
  if(d.startsWith('▼'))return parseNum(d.slice(1))>=10?'color-down10':'color-down1';
  return'';
}
function rowName(row,idx,kind){
  if(kind==='song')return val(row,idx.song)||'Unknown';
  if(kind==='album')return val(row,idx.album)||'Unknown';
  return val(row,idx.artist)||'Unknown';
}
function coverHtml(url,one,mobile=false){
  const cls=mobile?(one?'m-cover one':'m-cover'):(one?'cover one':'cover');
  return `<div class="${cls}">${url?`<img src="${esc(url)}" loading="lazy" onerror="this.remove();this.parentElement.innerHTML='<i class=\'fas fa-music\'></i>'">`:'<i class="fas fa-music" style="opacity:.3;font-size:24px"></i>'}</div>`;
}
function metricsHtml(lw,peak,weeks){
  return `<div class="metrics"><span>LW ${esc(lw||'-')}</span><span class="sep">·</span><span>PEAK ${esc(peak||'-')}</span><span class="sep">·</span><span>WEEKS ${esc(weeks||'-')}</span></div>`;
}
function mobileMetricsHtml(lw,peak,weeks){
  return `<div class="m-metrics"><span>LW ${esc(lw||'-')}</span><span>·</span><span>PEAK ${esc(peak||'-')}</span><span>·</span><span>WEEKS ${esc(weeks||'-')}</span></div>`;
}
function detailHtml(row,i){
  const fields=[['Units',val(row,i.units)],['Total Units',val(row,i.totalUnits)],['Sales',val(row,i.sales)],['Streams',val(row,i.streams)],['Airplay',val(row,i.airplay)]].filter(x=>x[1]);
  if(!fields.length)return '<div class="details">Details shown. Press + again to close.</div>';
  return `<div class="details"><div class="details-grid">${fields.map(([k,v])=>`<div class="detail-box"><div class="detail-k">${k}</div><div class="detail-v">${esc(v)}</div></div>`).join('')}</div></div>`;
}
function renderRows(data,date){
  const cfg=charts[state.active],i=data.idx,all=data.byDate[date]||[];
  const rows=all.filter(r=>state.filters.has('all')||state.filters.has(diffType(val(r,i.diff))));
  if(!rows.length){content.innerHTML='<div class="error">No entries match these filters.</div>';return}
  content.innerHTML=rows.map(r=>{
    const pos=parseInt(val(r,i.position))||0,name=rowName(r,i,cfg.kind),artist=val(r,i.artist)||'Unknown',diff=val(r,i.diff),lw=val(r,i.lw)||'-',peak=val(r,i.peak)||'-',weeks=val(r,i.weeks)||'-',w1=parseInt(val(r,i.weeksAt1))||0,one=pos===1,cover=val(r,i.cover);
    const key=`${date}|${pos}|${name}|${artist}`,open=state.details.has(key);
    const copy=`#${pos} ${name}${cfg.kind!=='artist'?' — '+artist:''} | LW ${lw} | Peak ${peak} | Weeks ${weeks}`;
    const star=(diff==='NEW'||diff==='RE'||diff.startsWith('▲'));
    return `<article class="chart-card ${colorClass(diff)}" data-key="${esc(key)}">
      <div class="desktop-row">
        <div class="rank-wrap"><div class="rank-num ${one?'one':''}">${pos}</div>${one&&w1>=2?`<div class="weeks1">${w1} WEEKS</div>`:''}</div>
        ${coverHtml(cover,one,false)}
        <div class="diff-wrap">${diffHtml(diff)}</div>
        <div class="entry">
          <div class="entry-title ${one?'one':''}">${esc(name)}${!one&&w1>=2?`<span class="badge-inline">${w1}W AT #1</span>`:''}</div>
          ${cfg.kind!=='artist'?`<div class="artist ${one?'one':''}">${esc(artist)}</div>`:''}
        </div>
        <div class="right">
          ${star?'<span class="award" title="Gains in performance"><i class="fas fa-star" style="font-size:11px"></i></span>':''}
          ${metricsHtml(lw,peak,weeks)}
          <div class="actions">
            ${cfg.kind==='song'?'<button class="action play" aria-label="Play preview"><i class="fas fa-play"></i></button>':''}
            <button class="action copy" aria-label="Copy info" data-copy="${esc(copy)}"><i class="fas fa-copy"></i></button>
            <button class="action details-btn" aria-label="Toggle details" data-key="${esc(key)}">${open?'−':'+'}</button>
          </div>
        </div>
      </div>

      <div class="mobile-row">
        <div class="m-rank"><div class="m-rank-num">${pos}</div><div class="m-diff">${diffHtml(diff)}</div>${one&&w1>=2?`<div class="weeks1" style="font-size:7px;padding:2px 4px">${w1}W AT #1</div>`:''}</div>
        ${coverHtml(cover,one,true)}
        <div class="m-entry"><div class="m-title">${esc(name)}${!one&&w1>=2?`<span class="badge-inline" style="font-size:7px">${w1}W AT #1</span>`:''}</div>${cfg.kind!=='artist'?`<div class="m-artist">${esc(artist)}</div>`:''}${mobileMetricsHtml(lw,peak,weeks)}</div>
        <div class="m-actions"><div class="m-actions-top">${star?'<span class="award"><i class="fas fa-star" style="font-size:10px"></i></span>':''}${cfg.kind==='song'?'<button class="action play"><i class="fas fa-play"></i></button>':''}<button class="action copy" data-copy="${esc(copy)}"><i class="fas fa-copy"></i></button></div><button class="action details-btn" data-key="${esc(key)}">${open?'−':'+'}</button></div>
      </div>
      ${open?detailHtml(r,i):''}
    </article>`;
  }).join('');

  content.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy||'');b.innerHTML='<i class="fas fa-check"></i>';setTimeout(()=>b.innerHTML='<i class="fas fa-copy"></i>',1200)}catch{}});
  content.querySelectorAll('.details-btn').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(state.details.has(k))state.details.delete(k);else state.details.add(k);renderRows(data,date)});
}

function renderDropouts(data,date){
  const idx=data.dates.indexOf(date),i=data.idx;
  if(idx<=0){dropoutsEl.innerHTML='';return}
  const prev=data.byDate[data.dates[idx-1]]||[],curr=data.byDate[date]||[];
  const keys=new Set(curr.map(r=>`${rowName(r,i,charts[state.active].kind).toLowerCase()}|${val(r,i.artist).toLowerCase()}`));
  const outs=prev.filter(r=>!keys.has(`${rowName(r,i,charts[state.active].kind).toLowerCase()}|${val(r,i.artist).toLowerCase()}`));
  if(!outs.length){dropoutsEl.innerHTML='';return}
  dropoutsEl.innerHTML=`<div class="dropouts"><div class="dropouts-title">DROP-OUTS</div>${outs.map(r=>`<div class="dropout"><div class="dropout-rank">#${esc(val(r,i.position))}</div><div class="dropout-info"><div class="dropout-name">${esc(rowName(r,i,charts[state.active].kind))}</div><div class="dropout-meta">${charts[state.active].kind!=='artist'?esc(val(r,i.artist))+' · ':''}Peak #${esc(val(r,i.peak)||'-')} · Weeks ${esc(val(r,i.weeks)||'-')}</div></div></div>`).join('')}</div>`;
}

function syncWeekButtons(data){
  const idx=data.dates.indexOf(state.date),prev=idx>0?data.dates[idx-1]:null,next=idx>=0&&idx<data.dates.length-1?data.dates[idx+1]:null;
  for(const id of ['prevBtn','prevBtnBottom']){const b=document.getElementById(id);b.disabled=!prev;b.onclick=()=>prev&&setDate(prev,data)}
  for(const id of ['nextBtn','nextBtnBottom']){const b=document.getElementById(id);b.disabled=!next;b.onclick=()=>next&&setDate(next,data)}
}
function setDate(date,data){
  state.date=date;weekSelect.value=date;dateLabel.textContent='Chart week of '+fmtDate(date);renderNav();syncWeekButtons(data);renderRows(data,date);renderDropouts(data,date);window.scrollTo({top:0,behavior:'smooth'});
}
async function loadChart(id,requestedDate=null){
  state.active=id;state.details.clear();chartTitle.textContent=charts[id].title;content.innerHTML='<div class="loader-wrap"><div class="loader"></div></div>';dropoutsEl.innerHTML='';
  try{
    const data=await fetchChart(id);if(!data.dates.length)throw new Error('No dates');
    let date=requestedDate&&data.byDate[requestedDate]?requestedDate:data.dates[data.dates.length-1];
    state.date=date;
    weekSelect.innerHTML=data.dates.slice().reverse().map(d=>`<option value="${d}">${fmtShort(d)}</option>`).join('');
    weekSelect.value=date;weekSelect.onchange=()=>setDate(weekSelect.value,data);
    dateLabel.textContent='Chart week of '+fmtDate(date);
    renderNav();syncWeekButtons(data);renderRows(data,date);renderDropouts(data,date);
  }catch(e){content.innerHTML='<div class="error">This chart did not load.<br><button class="gold-btn" style="margin-top:12px" onclick="state.cache.delete(state.active);loadChart(state.active,state.date)">Try again</button></div>'}
}

document.getElementById('filters').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.filter;
  if(k==='all'){state.filters=new Set(['all'])}
  else{state.filters.delete('all');if(state.filters.has(k))state.filters.delete(k);else state.filters.add(k);if(!state.filters.size)state.filters.add('all')}
  document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',state.filters.has(x.dataset.filter)));
  const data=state.cache.get(state.active);if(data)renderRows(data,state.date);
});
document.getElementById('colorToggle').onclick=()=>{
  state.diffColors=!state.diffColors;document.getElementById('colorToggle').classList.toggle('active',state.diffColors);
  const data=state.cache.get(state.active);if(data)renderRows(data,state.date);
};
document.getElementById('themeToggle').onclick=()=>{
  const dark=document.documentElement.classList.toggle('dark');try{localStorage.setItem('theme',dark?'dark':'light')}catch{}
  document.querySelector('#themeToggle i').className='fas '+(dark?'fa-sun':'fa-moon');
};
document.querySelector('#themeToggle i').className='fas '+(document.documentElement.classList.contains('dark')?'fa-sun':'fa-moon');
const backTop=document.getElementById('backTop');
window.addEventListener('scroll',()=>backTop.style.display=window.scrollY>300?'flex':'none');
backTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

renderNav();
loadChart('songs');
</script>
</body>
</html>
